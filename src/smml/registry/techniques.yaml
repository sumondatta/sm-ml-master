- name: PDF text, table and image extraction stack
  what: 'Text/layout: PyMuPDF (`fitz`), pdfplumber, pdfminer.six, pypdfium2. Tables: camelot (lattice
    + stream), tabula-py (Java/tabula), pdfplumber''s `extract_tables`, and the layout models below. Layout/VLM
    parsers: Grobid (above), Nougat (facebook/nougat-base, academic PDF→Markdown incl. LaTeX math), marker
    (datalab-to/marker), docling (IBM, DoclingDocument JSON with figure/table objects), unstructured (typed
    elements: Title/NarrativeText/Table/Image), MinerU, Nemotron Parse. Images: `page.get_images(full=True)`
    + `doc.extract_image(xref)`, and `page.get_text(''dict'')` for spans with bboxes.'
  why: Most of the soil moisture numbers that AREN'T in figures are in tables (seasonal mean VWC by depth
    and treatment) and in methods prose (depths, sensor model, plot coordinates, soil texture). You need
    all three channels — figure digitization alone will miss the metadata that makes a data point usable.
  how: 'Practical order of operations per PDF:

    1. `doc = fitz.open(path)`; if `len(page.get_text().strip()) < 100` for most pages, it''s a scan →
    route to OCR (ocrmypdf --force-ocr, or PaddleOCR/Surya) before anything else.

    2. Text + layout: `page.get_text(''dict'')` gives blocks→lines→spans each with `bbox`, `font`, `size`,
    `color`. Use font size/weight to find captions (captions are typically 1-2pt smaller than body and
    start with `^(Fig(ure)?|Table)\s*\.?\s*(\d+|[IVX]+)`).

    3. Tables: try camelot `flavor=''lattice''` first (works when the table has ruling lines — common
    in agronomy journals), fall back to `flavor=''stream''` with `table_areas` set from a detected table
    bbox, and cross-check against pdfplumber''s `extract_tables(table_settings={''vertical_strategy'':''text'',''horizontal_strategy'':''lines''})`.
    Accept a table only if ≥2 parsers agree on the shape, else flag for VLM re-read.

    4. High-value fallback: run `docling` (`DocumentConverter().convert(path).document`) — it emits a
    `DoclingDocument` with `pictures[]` (each with `get_image(doc)` and provenance bbox) and `tables[]`
    (as DataFrames), which is the cleanest single-call way to get caption-associated figure crops. `marker`
    is faster; `Nougat` is best on math-heavy arXiv PDFs but hallucinates on tables and has a repetition-loop
    failure mode.

    5. Raster images: `for xref, *_ in page.get_images(full=True): img = doc.extract_image(xref)` gives
    `image` bytes, `width`, `height`, `colorspace`, `smask`. IMPORTANT: check the native resolution —
    `width/rect_width_in_inches` gives the effective DPI. If native DPI > render DPI, use the embedded
    image directly rather than re-rasterizing the page.

    6. Caption→figure association algorithm: for each caption span with a `Fig N` prefix, find the candidate
    graphic (embedded image bbox, or a cluster from `page.cluster_drawings()`) that (a) is on the same
    page, (b) horizontally overlaps the caption by >50% of the narrower width, (c) is ABOVE the caption
    (journals put figure captions below; table captions above — flip the rule for tables), and (d) minimizes
    vertical gap. Score = `1.0*horizontal_IoU - 0.01*vertical_gap_pt`, take the argmax, require gap <
    120 pt. Handle multi-panel by taking the union bbox of all candidates satisfying (a)-(c) within the
    gap threshold, then splitting into panels later.

    7. Panel splitting: on the figure crop, compute row and column projection profiles of ''non-background''
    pixels (`np.mean(gray < 250, axis=0/1)`); find maximal runs where the profile is 0 (pure whitespace)
    that are wider than ~3% of the image; cut there recursively (guillotine split). Validate each sub-panel
    by checking it contains ≥2 long straight lines (axes). Label panels by OCRing the top-left 15% of
    each sub-panel for `^\(?[a-hA-H]\)?$`.'
