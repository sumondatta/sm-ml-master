- name: Raster plot digitization — series separation and curve tracing
  what: Turn the pixels inside the plot frame into per-series (u, v) pixel traces, then into data values.
  why: This is the actual data extraction. Soil-moisture figures are typically 2-6 series (depths or treatments)
    of VWC vs time, often overlapping, often with markers, often with a rainfall bar chart on a secondary
    axis. Getting series separation right is what determines whether you harvest usable multi-depth training
    data or noise.
  how: 'A. Build the interior mask: crop to the axis rectangle inset by the line width; remove the frame,
    gridlines and any in-plot text/legend box (detect text via a connected-component filter: components
    with 6<h<30 px and aspect 0.2<w/h<3 clustered into rows → text; or run OCR and blank its boxes).


    B. COLOUR CLUSTERING (primary method for colour figures):

    1. Convert to CIELAB: `lab = cv2.cvtColor(img, cv2.COLOR_RGB2LAB).astype(np.float32); lab[...,0]*=100/255;
    lab[...,1:]-=128`.

    2. Take only foreground pixels (not background, not black/gray frame): keep pixels where chroma `sqrt(a²+b²)
    > 12` OR `L < 60` (to keep black series).

    3. Cluster with k-means where k = (number of legend entries) if the legend was parsed, else choose
    k by running k=2..8 and taking the largest k whose minimum inter-centroid ΔE00 > 15. Use `sklearn.cluster.MiniBatchKMeans`
    on a 20k-pixel random subsample for speed, then assign all pixels to the nearest centroid.

    4. Better than k-means when the legend IS parsed: for each legend swatch colour `c_k`, assign pixel
    p to series k iff `deltaE_ciede2000(lab_p, c_k) < 12` and k = argmin. Use `skimage.color.deltaE_ciede2000`.
    Threshold 10-15 works for distinct palettes; drop to 8 if two series are similar hues. Leave unassigned
    pixels (anti-aliased edges, overlaps) as ''ambiguous''.

    5. GRAYSCALE FIGURES (very common in older agronomy papers): colour is useless. Separate by LINE STYLE
    instead — for each connected component run a dash-pattern analysis along the traced path (run-length
    encode ink/gap along arc length; cluster by (mean dash length, mean gap length, line width)). Solid/dashed/dotted/dash-dot
    become the series key. Match to the legend by running the same run-length analysis on the legend swatches.
    Separate marker series by marker SHAPE via template matching of the legend marker glyph (`cv2.matchTemplate`
    with TM_CCOEFF_NORMED, threshold 0.7, then non-max suppression at a radius of the marker size) or
    by Hu moments of each small connected component.


    C. LINE TRACING (per series mask):

    - Per-x-column extraction (the WebPlotDigitizer ''X Step with interpolation'' approach): for each
    pixel column u in the plot area, take the set of foreground rows `V_u` for that series. If `len(V_u)==0`,
    mark as a gap. If the run of rows is contiguous and its height ≤ 2.5*line_width, emit the MEDIAN (not
    mean — median is robust to an intersecting series). If the run splits into multiple disjoint groups
    (the curve doubles back, or two branches of the same series overlap), emit the group nearest to the
    previous column''s value (continuity tracking) and record the others as a branch-ambiguity flag.

    - Averaging-window approach (WPD''s default, good for noisy/anti-aliased scans): slide a Δu × Δv window
    (start Δu = 2*line_width, Δv = 5*line_width) and emit the intensity-weighted centroid of foreground
    pixels in each window; step Δu/2.

    - Connected-components sanity: `cv2.connectedComponentsWithStats(series_mask)` — discard components
    with area < 20 px or bbox diagonal < 10 px (these are legend remnants and JPEG artefacts).

    - Skeletonize for topologically messy curves: `skimage.morphology.skeletonize(mask)` then walk the
    skeleton graph with `sknw.build_sknw` — useful for hysteresis loops / retention curves that are not
    functions of x.


    D. MARKER / SCATTER EXTRACTION (soil moisture series are usually markers, not lines):

    - `cv2.SimpleBlobDetector` with params: `filterByArea=True, minArea=(0.5*expected_marker_px)**2, maxArea=(2*expected)**2,
    filterByCircularity=True, minCircularity=0.5, filterByConvexity=True, minConvexity=0.7, filterByInertia=True,
    minInertiaRatio=0.3, blobColor` set per series mask.

    - Or template matching using the legend''s marker glyph as the template (best when markers overlap
    the line).

    - Or `cv2.HoughCircles(gray, cv2.HOUGH_GRADIENT, dp=1, minDist=0.8*marker_d, param1=100, param2=12,
    minRadius=int(0.4*marker_d/2), maxRadius=int(1.6*marker_d/2))` for filled circles only.

    - Estimate `expected_marker_px` from the legend swatch size.

    - De-overlap: if two markers of the SAME series merge into one blob of ~2x area, split with a distance-transform
    watershed (`cv2.distanceTransform` → `skimage.segmentation.watershed`).


    E. OVERLAPPING SERIES: where two series cross, pixels are ambiguous. Resolve by (i) drawing order
    — in a PDF the later-drawn series occludes; (ii) continuity — extrapolate each series linearly from
    the last 5 clean columns and assign the crossing pixels to whichever prediction is nearest; (iii)
    simply mark the crossing region as a gap and interpolate, flagging those points with `quality=''interpolated_crossing''`.
    For your purposes, dropping 3 points at a crossing is far better than emitting 3 wrong ones.


    F. ERROR BARS: detect as thin vertical strokes centred on a marker x with horizontal caps. For each
    marker, search the column band `[u_m-1, u_m+1]` for contiguous foreground extending above/below the
    marker; the extents give `y_upper`, `y_lower`. Record as `err_low`, `err_high` in data units. Do NOT
    let the error bar contaminate the marker centroid — exclude the 1-2 px wide central column when computing
    the marker centre, or use the template-matched centre.


    G. SUB-PIXEL REFINEMENT: for each emitted point, take the local intensity profile perpendicular to
    the curve (or the marker''s local window) and compute the intensity-weighted centroid `v* = Σ(w_i·v_i)/Σw_i`
    with `w_i = 1 - gray_i/255` (i.e. ''inkiness''), over a window of ±1.5*line_width. This routinely
    gives ~0.2 px precision versus 0.5 px for nearest-pixel. Alternatively fit a 1-D Gaussian to the profile
    and take the mean. WPD''s improved averaging window does exactly this.


    H. RESAMPLING: convert to data units, sort by x, drop non-monotone duplicates (for a time series keep
    the median y per unique x), then resample onto a fixed grid with a SHAPE-PRESERVING interpolator —
    `scipy.interpolate.PchipInterpolator` (monotone cubic, no overshoot) rather than `CubicSpline` (which
    invents oscillation and can push VWC negative). Never extrapolate beyond the traced x-range; set NaN
    outside. For soil moisture time series, resample to daily (or the native measurement interval implied
    by the marker spacing) and record `n_native_points` vs `n_resampled` so a model can down-weight interpolated
    values.'
