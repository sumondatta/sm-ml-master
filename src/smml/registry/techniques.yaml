- name: Automated rejection of bad extractions — physical, structural and cross-method checks
  what: A deterministic gauntlet every extracted series must pass before entering the training set, plus
    a triage queue for the ones that fail.
  why: A single mis-calibrated axis can inject thousands of physically impossible values. In an ML training
    set these are worse than missing data. Automated rejection plus a human review queue for the top-N
    suspicious cases is how you get a dataset you can defend.
  how: 'PHYSICAL RANGE CHECKS (reject or flag):

    - Volumetric water content: 0.00 ≤ θv ≤ 0.65 m³/m³. Hard reject outside [-0.02, 0.75]. Additionally
    reject if θv > porosity estimated from bulk density (`φ = 1 - ρb/2.65`) by more than 0.05.

    - If values are in 0-65 with unit ''%'', divide by 100; if in 0-0.65 with unit ''%'', the unit label
    is wrong — flag.

    - Gravimetric: 0 ≤ θg ≤ 0.60 g/g (peat can exceed; gate on soil type).

    - Storage: 0 ≤ S ≤ 0.65 × depth_mm.

    - Matric potential: -1500 ≤ ψ ≤ 0 kPa (reject positive matric potential unless clearly labelled as
    tension/suction magnitude, in which case flip sign).

    - Relative extractable water / saturation: 0-1 or 0-100%.

    UNIT AUTO-DETECTION as a check: histogram the series; if median ∈ [0.05,0.55] → m³/m³; if ∈ [5,55]
    → percent; if ∈ [50,400] → mm storage; if negative and |·| ∈ [1,1500] → kPa. If the detected unit
    disagrees with the OCR''d axis title, flag `unit_inferred_not_stated` and route to VLM.


    STRUCTURAL CHECKS:

    - Number of extracted series must equal the number of legend entries (±0). Mismatch ⇒ flag 2048/8.

    - Every point must lie inside the axis limits; points outside ⇒ clipped extraction bug.

    - x must be monotone non-decreasing for a time series after sorting; >5% duplicate x values with materially
    different y ⇒ two series merged.

    - Axis fit R² ≥ 0.999 and tick count ≥ 3; else reject the figure entirely.

    - Series y-range must span > 2% of the axis range (a flat line at exactly one value is usually a mis-detected
    gridline or axis).

    - Sampling density: a soil moisture time series with 3 points over a season is probably a bar chart
    misread; require ≥ 8 points for a time series unless `chart_type==''bar''`.

    - Temporal plausibility: consecutive daily Δθv should rarely exceed +0.25 (a wetting event) or -0.10
    (drying) in a day; count violations and reject if > 5% of steps. Wetting spikes should coincide with
    a rainfall/irrigation event where that data exists — this is a strong, physics-based validator.

    - Depth ordering: in a multi-depth series set from the same plot, shallower depths should show HIGHER
    temporal variance than deeper ones. Compute `var(θ)` per depth; if variance increases monotonically
    with depth across ≥3 depths, the depth labels are probably reversed — flag for review. (This is a
    genuinely powerful soil-physics check.)

    - Depth profile plots: θ vs depth should be reasonably smooth; reject if the second difference exceeds
    0.2 m³/m³ between adjacent depths.


    CROSS-METHOD AGREEMENT:

    - Run vector extraction, raster CV, and LineFormer where all are possible. Normalized mean abs difference
    (divided by y-axis range) < 0.02 ⇒ accept; 0.02-0.10 ⇒ VLM adjudication; > 0.10 ⇒ human queue.

    - ROUND-TRIP VALIDATION (do this for every figure): re-render the extracted series with matplotlib
    using the recovered axis limits, rasterize at the same size, and compute (a) IoU between the rendered
    series mask and the original series mask, (b) mean nearest-neighbour pixel distance. Require IoU ≥
    0.6 and mean distance ≤ 2 px. This is the single most effective automated check and it needs no ground
    truth.

    - Cross-check against reported summary statistics: if the paper''s text or a table states ''mean soil
    water content was 0.24 m³/m³ at 0-30 cm'', compare with the mean of your digitized series; require
    |Δ| < 0.03. Extract those statements with a regex + LLM pass over the results section.


    GOLD-STANDARD BENCHMARK: hand-digitize (WebPlotDigitizer manual mode) 100 figures spanning vector/raster,
    colour/grayscale, line/scatter, linear/log. Use them as a regression test suite — every pipeline change
    must not degrade median absolute error, and you report this MAE in the dataset paper. Target: median
    |error| < 1% of the y-axis range for raster, < 0.01% for vector.


    TRIAGE UI: build a tiny review tool (Streamlit or an HTML page) showing the original figure, the overlaid
    extraction, the flags, and accept/fix/reject buttons. Sort the queue by (n_points_affected × flag_severity)
    so a human hour fixes the most data. Log every human decision as training data for a learned reject
    classifier.'
