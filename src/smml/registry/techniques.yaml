- name: Uncertainty quantification for every digitized value
  what: Propagate pixel-level resolution, line-width, calibration and interpolation error into a per-point
    σ, stored alongside every extracted (x, y).
  why: Your ML model will be trained on a mixture of exact vector data, good digitizations and marginal
    ones. Without a per-point σ you cannot weight the loss, cannot filter, and cannot honestly report
    dataset quality. This is also what makes the dataset publishable.
  how: "Define the local data-units-per-pixel scale from the fitted transform:\n  linear: `s_y = dy/dv\
    \ = A_y` (data units per pixel); log: `s_y(v) = ln(10)*A_y*y` (scale depends on value).\nComponents\
    \ (all in data units):\n1. Quantization / centroid error: with sub-pixel centroiding, σ_pix ≈ 0.3\
    \ px; without it, σ_pix = 1/sqrt(12) ≈ 0.29 px for pure rounding but realistically 0.5 px. Contribution\
    \ `σ_1 = |s_y| * σ_pix`.\n2. Line/marker width: a stroke of width w px gives an intrinsic ambiguity;\
    \ treating it as uniform over the stroke, `σ_2 = |s_y| * w / sqrt(12)`. For markers of diameter d,\
    \ `σ_2 = |s_y| * d / sqrt(12)` unless you template-matched the centre (then use d/6).\n3. Axis calibration\
    \ error: from the least-squares fit of x_i = A·u_i + B, the covariance of (A,B) is `σ_res² (UᵀU)⁻¹`\
    \ where U is the design matrix and σ_res the residual std of the tick fit. The prediction variance\
    \ at pixel v is `var_cal(v) = σ_res² * (1/n + (v - v̄)²/Σ(v_i-v̄)²)`. Take `σ_3 = sqrt(var_cal(v))`.\n\
    4. Interpolation/resampling: for a point produced by PCHIP between native points spaced Δx apart,\
    \ add `σ_4 = 0.5 * |dy/dx| * Δx_local` (linear-interpolation error bound), and set a boolean `is_interpolated`.\n\
    5. Rendering: if the figure was rasterized from a lossy JPEG, multiply σ_1+σ_2 by 1.5.\nTotal: `σ_y\
    \ = sqrt(σ_1² + σ_2² + σ_3² + σ_4²)`; same construction for σ_x.\nSanity anchor: a typical 600-DPI\
    \ crop of a 3-inch-tall panel spanning 0-0.5 m³/m³ gives s_y ≈ 0.5/1800 ≈ 2.8e-4 m³/m³ per pixel;\
    \ with a 3-px line, σ_y ≈ 3e-4 to 5e-4 m³/m³ — i.e. digitization noise is an order of magnitude below\
    \ sensor noise (±0.02-0.03 m³/m³ for uncalibrated FDR). At 150 DPI it's ~1.1e-3, still fine. THIS\
    \ IS THE KEY RESULT: careful digitization is not the limiting error source; axis mis-calibration and\
    \ unit errors are. Spend your effort there.\nFor vector extractions set `extraction_method='vector_exact'`,\
    \ σ_1=σ_2=0, keep σ_3 (the tick-label fit is still a fit, though with exact text positions σ_res is\
    \ ~1e-3 pt → negligible) and σ_4.\nValidate the whole σ model empirically: hand-digitize 50 figures\
    \ for which you ALSO have the authors' deposited data (find them via DataCite relatedIdentifiers),\
    \ compute actual errors, and check that ~68% fall inside ±1σ. Report the calibration curve."
