- name: Raster plot digitization — axis frame and tick detection
  what: Given a figure bitmap (ideally 400-600 DPI), locate the plot frame, the tick marks, and the tick
    label text so you can build the pixel→data transform.
  why: Everything downstream is meaningless if the affine transform is wrong. A 1% error in the axis calibration
    is a systematic bias across every point from that figure, which is far more damaging to your ML training
    set than random tracing noise.
  how: "Step 1 — preprocess: convert to grayscale; if the background is off-white, estimate it as the\
    \ modal pixel value and normalize. Binarize non-background: `mask = (rgb.astype(int).max(2) - rgb.astype(int).min(2)\
    \ > 20) | (gray < 245)`. Deskew: run `cv2.HoughLinesP`, take the modal angle of near-horizontal lines,\
    \ and `cv2.warpAffine` by its negative if |angle| > 0.2°.\n\nStep 2 — plot frame by projection profiles\
    \ (more robust than Hough for clean plots):\n`col_sum = mask.sum(axis=0); row_sum = mask.sum(axis=1)`\n\
    Axis lines are the columns/rows where the sum exceeds ~0.6 * (image height/width). Take the leftmost\
    \ such column as the y-axis (u_axis), the bottom-most such row as the x-axis (v_axis); if a full box\
    \ frame exists you also get right/top. If no single column passes, lower to 0.4 and take the two strongest\
    \ peaks separated by >50% of the width.\nCross-check with `cv2.HoughLinesP(edges, rho=1, theta=np.pi/360,\
    \ threshold=int(0.5*min(H,W)), minLineLength=int(0.5*min(H,W)), maxLineGap=5)` filtered to |dx|<2\
    \ or |dy|<2.\n\nStep 3 — tick marks: on the x-axis, look in the band `v_axis+1 : v_axis+12` and compute\
    \ a column-wise sum; local maxima above 3 px tall, separated by ≥8 px, are ticks. Same on the y-axis\
    \ in `u_axis-12 : u_axis-1`. Record tick pixel positions `u_t[i]`, `v_t[j]`. If no tick marks are\
    \ drawn (common in some styles), fall back to using the centroids of the tick LABELS themselves as\
    \ the anchor positions.\n\nStep 4 — tick labels by OCR: crop below the x-axis (`v_axis+2 : v_axis+0.12*H`,\
    \ full width) and left of the y-axis (`0 : u_axis-2`, full height). For the y-axis, rotate the crop\
    \ 90° if the labels are vertical. Run OCR with a numeric-restricted config first:\n`pytesseract.image_to_data(crop,\
    \ config='--psm 11 -c tessedit_char_whitelist=0123456789.,-–−+eE×x^%/', output_type=Output.DICT)`\
    \ — psm 11 (sparse text) or psm 6. Upscale the crop 3-4x with `cv2.INTER_CUBIC` before OCR; small-font\
    \ tick labels are the #1 OCR failure and upscaling fixes most of it.\nRun a second engine and require\
    \ agreement: `easyocr.Reader(['en']).readtext(crop, allowlist='0123456789.-')` or `paddleocr.PaddleOCR(lang='en').ocr(crop)`.\
    \ PaddleOCR (PP-OCRv4/v5) is generally the most accurate on small scientific text; EasyOCR is easiest\
    \ to install; Tesseract is fastest. Accept a label only if ≥2 of 3 engines produce the same parsed\
    \ float, else mark the figure for human/VLM review.\nNormalize OCR quirks: unicode minus '−'→'-',\
    \ 'O'→'0', 'l'/'I'→'1', 'S'→'5', ',' as decimal separator (European papers!) vs thousands separator\
    \ — decide by whether the sequence is monotone after each interpretation.\nDate axes: parse with `dateutil.parser`\
    \ plus explicit patterns for DOY (1-366 integers with an axis title containing 'DOY'/'day of year'/'Julian'),\
    \ 'Jun-15', '15/06/2018', 'MMM' month abbreviations; convert to days since epoch for the linear fit.\n\
    \nStep 5 — build the transform. With tick pixel positions `u_i` and parsed values `x_i` (need ≥2,\
    \ prefer ≥3):\n  linear: solve `[x] = A·u + B` by `np.polyfit(u, x, 1)`; compute residual RMS. REQUIRE\
    \ the ticks to be evenly spaced in pixel space for a linear axis (`std(diff(u))/mean(diff(u)) < 0.02`)\
    \ — if they're evenly spaced but the VALUES are 1,10,100, it's log.\n  log: `np.polyfit(u, np.log10(x),\
    \ 1)`, then `x = 10**(A*u+B)`.\n  Pick whichever gives lower residual; require R² ≥ 0.999 else reject\
    \ the figure.\n  Full 2D form (handles residual rotation/shear): fit an affine `[x,y,1]ᵀ = M·[u,v,1]ᵀ`\
    \ by least squares from ≥3 non-collinear calibration points (`cv2.estimateAffine2D` or `np.linalg.lstsq`);\
    \ use a homography (`cv2.findHomography`) only for photographed/perspective-distorted figures.\n\n\
    Step 6 — axis TITLES and UNITS: OCR the region below the x tick labels and left of the y tick labels\
    \ (rotate 90° CW for the y title). Regex the units: `(m3\\s*m-3|m³/m³|cm3\\s*cm-3|%|v/v|mm|kPa|MPa|cm)`.\
    \ This is what lets you normalize θ later. If the y title matches soil-moisture vocabulary and the\
    \ range is 0-0.6, you have VWC in m³/m³; if 0-60, it's volumetric percent; if 0-0.4 with 'g/g', it's\
    \ gravimetric."
