- name: 'VECTOR-FIRST extraction: read exact coordinates from PDF drawing operators'
  what: Pull the literal path geometry the publisher's typesetter emitted — `page.get_drawings()` / `page.get_cdrawings()`
    in PyMuPDF — and invert the axis transform to recover the authors' original numbers with ZERO digitization
    error.
  why: This is the highest-value technique in the entire pipeline and almost nobody does it. A matplotlib/R/SigmaPlot/Origin
    figure placed into a PDF as vector art still contains every data point as an explicit path coordinate.
    When it works you get machine-precision values, not ±2% digitized estimates. For arXiv/EarthArXiv/Copernicus/MDPI/Frontiers/PLOS
    PDFs (LaTeX or modern XML workflows) a large fraction of figures are vector. ALWAYS try this before
    touching a pixel.
  how: "Algorithm:\n1. `paths = page.get_drawings()` (or `page.get_cdrawings()` for the faster raw-dict\
    \ variant, ~5-10x quicker on figure-dense pages). Each path dict has: `items` (list of drawing commands),\
    \ `type` ('s' stroke, 'f' fill, 'fs' both), `color` (stroke RGB tuple 0-1), `fill` (fill RGB), `width`\
    \ (line width pt), `dashes` (string like '[3 3] 0'), `rect` (bbox), `closePath`, `even_odd`, `seqno`\
    \ (drawing order), `layer`, and with `extended=True` also clip-group info.\n2. Each item is a tuple:\
    \ `('l', Point p1, Point p2)` line, `('c', p1, p2, p3, p4)` cubic Bezier, `('re', Rect, orientation)`\
    \ rectangle, `('qu', Quad)` quad. Flatten Beziers by evaluating B(t) at t=0,0.1,...,1 — but for data\
    \ curves publishers almost always emit pure `'l'` polylines, so a Bezier-heavy path is usually a logo\
    \ or an arrow, not data.\n3. Restrict to the figure: keep paths whose `rect` is inside the Grobid/docling\
    \ figure bbox. Use `page.cluster_drawings()` to group.\n4. FIND THE AXES: the plot frame is the long\
    \ axis-aligned strokes. Collect all items that are `'l'` with p1.y≈p2.y (horizontal) or p1.x≈p2.x\
    \ (vertical) and length > 40% of the figure width/height. The axis rectangle is also often available\
    \ directly as the clip rect of the data paths (with `extended=True`, `path['scissor']`). Ticks are\
    \ short strokes (length 2-8 pt) perpendicular to and touching an axis line.\n5. CALIBRATE WITHOUT\
    \ OCR — this is the magic: `page.get_text('dict', clip=figure_rect)` gives every tick LABEL as a text\
    \ span with its exact bbox and its exact string. No OCR, no error. Match each tick mark's along-axis\
    \ coordinate to the nearest label span centre (within ~15 pt perpendicular distance, on the outside\
    \ of the axis). Parse the label to a float (handle '0.10', '10^{-2}' rendered as separate spans, thousands\
    \ separators, dates like '15-Jun' or DOY). Fit the transform by least squares over ≥3 ticks:\n   linear:\
    \  x_data = a*u_pt + b   (solve via np.polyfit degree 1; require R² > 0.9999)\n   log10:   log10(x_data)\
    \ = a*u_pt + b\n   Detect log automatically: fit both; if the log fit's R² beats the linear fit's,\
    \ and the tick label sequence is 1,10,100 or 1,2,5,10, declare log.\n   PDF y grows upward, PyMuPDF\
    \ y grows downward — apply `page.transformation_matrix` or just let the least-squares fit absorb the\
    \ sign.\n6. IDENTIFY DATA SERIES: group remaining paths by the tuple `(round(color,3), round(fill,3),\
    \ round(width,2), dashes)`. Each distinct style = one series. Map style→label by locating the legend:\
    \ the legend is a cluster of short line segments / small filled shapes each paired with a nearby text\
    \ span; match each legend swatch's style tuple to a series and take the text span to its right (within\
    \ 40 pt, vertically centred) as the series label.\n7. EMIT POINTS: for a line series, concatenate\
    \ the ordered `p1,p2` endpoints of its `'l'` items (dedupe consecutive duplicates), apply the transform,\
    \ sort by x. For a marker/scatter series, markers are many small paths with near-identical `rect`\
    \ width/height — take each path's `rect` centre. For error bars, they appear as a separate style (thin\
    \ strokes with caps); pair each with the nearest marker centre and record the half-length as the uncertainty.\n\
    8. Set `extraction_method='vector_exact'` and `sigma_y = 0` (report instead the PDF coordinate quantization,\
    \ ~1e-3 pt, i.e. negligible) — but STILL run the physical sanity checks.\n\nFallbacks in the vector\
    \ family: `page.get_svg_image()` → parse with `svgelements`/`svgpathtools` (useful when a figure is\
    \ an embedded SVG-ish Form XObject); `pdfminer.six`'s `LTCurve`/`LTLine` objects; `pdf2svg` + `lxml`.\n\
    Detection heuristic for 'is this figure vector?': count drawing items inside the figure bbox. `len(items)\
    \ > 50` and no embedded raster covering the bbox ⇒ vector. `len(items) < 10` and a big embedded image\
    \ ⇒ raster, go to the digitization pipeline."
