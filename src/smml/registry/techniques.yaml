- name: Deduplication across papers, versions, figures and datasets
  what: Collapse the same study appearing as preprint + accepted manuscript + version of record + repository
    copy + conference paper, and collapse the same figure/dataset appearing in multiple papers.
  why: Left unchecked, duplicates inflate the dataset, leak between train and test splits (the same field-season
    appearing in both), and bias the ML model toward heavily-republished studies. Train/test leakage via
    duplicated field-seasons is the single most likely way this project produces an over-optimistic accuracy
    number.
  how: 'LEVEL 1 — identifier: normalize DOI (`re.sub(r''^https?://(dx\.)?doi\.org/'', '''', doi).lower().strip()`),
    then union-find on {doi, pmid, pmcid, arxiv_id, openalex_id}. OpenAlex already merges preprint↔published
    into one Work with multiple `locations` — trust its `id` as the primary cluster key, and use Crossref
    `relation.is-preprint-of` / `has-preprint` as a second edge source.

    LEVEL 2 — fuzzy bibliographic: normalize title (lowercase, strip punctuation, collapse whitespace,
    remove a leading ''the/a''), then block on (first author surname, publication year ±1) and match within
    blocks using `rapidfuzz.fuzz.token_set_ratio >= 92`. Scale with MinHashLSH (`datasketch`, 128 perms,
    threshold 0.85) over 5-character shingles of title+first-200-chars-of-abstract to get candidate pairs
    in O(n).

    LEVEL 3 — embedding: SPECTER2 (`allenai/specter2_base`) embeddings of title+abstract; cosine > 0.98
    within the same year flags near-duplicates (also catches translated republications, which are common
    in Chinese/Spanish agronomy).

    LEVEL 4 — FIGURE-level: perceptual hash of every extracted figure (`imagehash.phash(img, hash_size=16)`);
    Hamming distance ≤ 8 ⇒ same figure. This catches the very common case of the same field experiment
    being plotted in a thesis chapter, a conference paper and a journal article. Also compare after resizing
    to a canonical 512px and converting to grayscale, so colour-recoloured reuse is caught.

    LEVEL 5 — DATA-level (the one that actually matters for ML): two series are duplicates if they refer
    to the same (site, year, depth, treatment) AND their resampled y-vectors agree. Compute: resample
    both to a common daily grid over the overlap, require overlap ≥ 30 days, then flag as duplicate if
    `RMSE < 0.005 m3/m3` or Pearson r > 0.995 with |mean bias| < 0.005. Keep the copy with the best provenance
    (priority: repository dataset > supplementary file > table parse > vector extraction > raster extraction
    > VLM) and link the rest with `duplicate_of`.

    LEVEL 6 — STUDY-level grouping for splits: build a `study_group_id` by clustering on (rounded lat/lon
    to 0.01°, site name normalized, institution, crop, years). Make your train/val/test split GROUP-WISE
    on `study_group_id` (and ideally spatially blocked — leave whole regions out), never randomly over
    rows. Use `sklearn.model_selection.GroupKFold` / `GroupShuffleSplit`.

    Dataset↔paper linking: use DataCite `relatedIdentifiers` (IsSupplementTo / IsSourceOf), Crossref `relation`,
    and Scholix (https://api.scholexplorer.openaire.eu/v3/Links?sourcePid=<doi>) to resolve which repository
    dataset belongs to which paper, so you prefer the deposited numbers over the digitized figure.'
