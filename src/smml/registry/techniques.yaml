techniques:
- name: OpenAlex Works API — primary discovery backbone
  what: 'REST API over ~260M scholarly works with abstracts (as inverted index), OA status, topics, references,
    and per-work `locations` (all known hosts, incl. PDF URLs). Base: https://api.openalex.org . Entity
    endpoints: /works, /works/{id}, /authors, /sources, /institutions, /topics. IDs accepted: W123456789,
    https://doi.org/10.x/y, doi:10.x/y, pmid:12345.'
  why: This is the cheapest way to enumerate the candidate corpus. Nothing else gives you 250M+ records,
    free, with cursor paging to unlimited depth, plus `best_oa_location.pdf_url` so you can go straight
    from a boolean query to a downloadable PDF. It is the spine that the whole literature-mining pipeline
    hangs off.
  how: 'CRITICAL CHANGE (verify first — this broke every old tutorial): as of 2026-02-13 OpenAlex REQUIRES
    an API key. Anonymous = 100 credits/day (testing only). Free registered key = 100,000 credits/day.
    The old `mailto=` polite-pool parameter is now IGNORED. Get a key at openalex.org/settings/api and
    pass `api_key=YOUR_KEY` as a URL query parameter (also send it as a header if the docs offer one;
    the URL param is confirmed). Keep the secondary limit in mind: ~10 requests/second.


    Query construction:

    - Full-text-ish search: `?search=<string>` searches title + abstract + fulltext (where OpenAlex has
    n-grams). Field-scoped: `?filter=title_and_abstract.search:<string>` (recommended for precision),
    `title.search:`, `abstract.search:`, `fulltext.search:`, `default.search:`.

    - Boolean: AND / OR / NOT must be UPPERCASE; phrases in double quotes. NOTE: wildcards (`irrigat*`)
    are NOT supported — enumerate the morphological variants explicitly (irrigation OR irrigated OR irrigating
    OR irrigate).

    - Stack filters with comma = AND, pipe = OR: `?filter=title_and_abstract.search:...,publication_year:1990-2026,type:article,open_access.is_oa:true,language:en`

    - Useful filters: `has_doi:true`, `has_fulltext:true`, `primary_topic.id:`, `concepts.id:`, `cited_by_count:>10`,
    `from_publication_date:1990-01-01`, `authorships.institutions.country_code:us|in|cn`.

    - Trim payload: `&select=id,doi,title,publication_year,primary_location,best_oa_location,locations,open_access,authorships,abstract_inverted_index,topics,referenced_works,type,language`
    (cuts response size ~5x, matters at 100k works).

    - Paging: for <10,000 results use `page`/`per_page` (per_page max 200 on works, 25 default; page*per_page
    <= 10,000). For anything bigger use cursor paging: first call `&cursor=*&per_page=200`, then read
    `meta.next_cursor` and pass it back as `&cursor=<value>` until `next_cursor` is null. Cursor and `page`
    are mutually exclusive.

    - Free reconnaissance: `&group_by=publication_year` / `&group_by=primary_topic.id` returns counts
    without burning result pages — use this to size a query before harvesting it.


    Abstracts come back as `abstract_inverted_index` ({token: [positions]}); reconstruct with: `words
    = [None]*(max(pos)+1); for w, ps in inv.items(): for p in ps: words[p]=w; abstract='' ''.join(w for
    w in words if w)`.


    Also worth harvesting for free: the full OpenAlex snapshot on S3 (`s3://openalex/data/works/`, requester-pays-free,
    JSON-Lines gzipped, ~400GB). For a terabyte-scale project, pull the snapshot once into DuckDB/Parquet
    and run your boolean queries locally — zero rate limits, full-text n-grams included. This is strongly
    recommended over 100k API calls/day.


    Python: `pyalex` (handles cursor paging + key), or plain `httpx` + `tenacity` retry on 429/5xx with
    exponential backoff and Retry-After honoring.'
  confidence: confirmed
  priority: 1
  libraries:
  - pyalex
  - httpx
  - tenacity
  - duckdb
  - pyarrow
  - boto3
  pitfalls: (1) The Feb 2026 API-key requirement silently degrades old code to 100 calls/day — you will
    think the API is broken. (2) `mailto=` is a no-op now; don't rely on it. (3) `.search` filter suffixes
    are being deprecated in favour of the `search` param — keep both code paths. (4) `abstract_inverted_index`
    is null for many paywalled Elsevier works. (5) OpenAlex `type` is noisy; `type:article` still contains
    editorials and errata. (6) The 10k deep-paging wall silently returns errors, not truncation — always
    cursor for big harvests.
- name: Crossref REST API — DOI ground truth, funder/licence metadata, full-text links
  what: 'https://api.crossref.org . Endpoints: /works, /works/{doi}, /journals/{issn}/works, /members/{id}/works,
    /prefixes/{prefix}/works. Returns registered metadata: title, container-title, ISSN, published date,
    author ORCIDs, licence array, funder array, `link` array (full-text URLs incl. `application/pdf` with
    `intended-application: text-mining`), `reference` list, `update-to` (retractions).'
  why: Crossref is the authoritative record for DOI, journal, dates and — crucially — the `link` array
    with text-mining-intended full-text URLs and the `license` array. You need licence strings per paper
    to decide what you may redistribute in your dataset. It is also your retraction/erratum check.
  how: "Query: `https://api.crossref.org/works?query.bibliographic=<free text>&filter=from-pub-date:1990-01-01,type:journal-article,has-full-text:true&rows=1000&mailto=you@example.com`.\n\
    Field queries: `query.title`, `query.container-title`, `query.author`, `query.bibliographic` (best\
    \ for fuzzy reference matching).\nFilters worth using: `has-full-text:true`, `full-text.type:application/pdf`,\
    \ `full-text.application:text-mining`, `license.url:`, `has-license:true`, `has-abstract:true`, `update-type:retraction`,\
    \ `funder:`, `issn:`.\nPaging: `rows` max 1000; beyond 10k results use cursor — first call `&cursor=*`,\
    \ then follow `message.next-cursor`. The API stops returning a cursor when exhausted.\nRate limit:\
    \ Crossref is still on the polite-pool model — include `mailto=` in the query string (or a `User-Agent:\
    \ MyTool/1.0 (mailto:you@example.com)` header) to get the polite pool, roughly 50 req/s; anonymous\
    \ pool is much slower and throttled. Read the `X-Rate-Limit-Limit` and `X-Rate-Limit-Interval` response\
    \ headers and adapt.\nReverse lookup for reference matching: POST-free `https://api.crossref.org/works?query.bibliographic=<raw\
    \ citation string>&rows=5` then score with `rapidfuzz`; accept if normalized title similarity >= 0.9\
    \ and year matches.\nPython: `habanero` (Crossref\0-maintained-ish client) or raw httpx."
  confidence: confirmed
  priority: 2
  libraries:
  - habanero
  - httpx
  - rapidfuzz
  pitfalls: Abstracts are present for only ~25% of works (JATS-encoded in `abstract`). `link` URLs usually
    403 unless you are on a Crossref TDM agreement or the article is OA — treat them as hints, resolve
    real PDFs through Unpaywall/CORE. Crossref `title` is an array, not a string. Deposited metadata quality
    varies wildly by publisher.
- name: Semantic Scholar Graph API + S2ORC full-text corpus
  what: 'Graph API base: https://api.semanticscholar.org/graph/v1 . Endpoints: /paper/search (relevance,
    ≤100/page, ≤1000 total), /paper/search/bulk (1000/call, continuation token, up to 10M), /paper/search/match
    (single best title match), /paper/{id} where id can be DOI:, ARXIV:, PMID:, CorpusId:, /paper/batch
    (POST up to 500 IDs), /paper/{id}/citations, /paper/{id}/references. Datasets API: https://api.semanticscholar.org/datasets/v1/release/latest/dataset/s2orc
    — S2ORC is the machine-readable full-text corpus (~12M+ full texts) with annotation spans for sections,
    figures, tables, bibliography.'
  why: S2ORC is the single biggest pre-parsed full-text corpus you can legitimately bulk-download, and
    its annotation spans mean you can locate figure captions and methods sections without running your
    own PDF parser on millions of papers. The Graph API's `/paper/search/bulk` plus `tldr` and `openAccessPdf`
    fields is the best OA-PDF firehose after OpenAlex.
  how: 'Bulk search: `GET /paper/search/bulk?query=<boolean>&fields=title,abstract,year,externalIds,openAccessPdf,publicationTypes,venue,fieldsOfStudy,s2FieldsOfStudy&year=1990-2026&openAccessPdf`.
    The `query` supports `+` (AND), `|` (OR), `-` (NOT), `"phrase"`, `*` prefix wildcard, `~N` fuzzy.
    Returns `token`; pass back as `&token=<token>` until null. 1000 records per call, 10M cap per query.

    Batch enrichment: `POST /paper/batch?fields=...` with body `{"ids":["DOI:10.1016/...", ...]}`, max
    500 per call — use this to hydrate DOIs you got from OpenAlex.

    Auth/limits: no key required but heavily throttled (shared unauthenticated pool, on the order of 5,000
    req / 5 min across all users, in practice you will see 429s). Request a free key at semanticscholar.org/product/api#api-key-form
    (an application form; turnaround days-to-weeks). With a key you get a guaranteed ~1 req/s across endpoints
    via header `x-api-key: <key>`. Always retry 429 with jittered backoff.

    S2ORC download: `GET /datasets/v1/release/latest/dataset/s2orc` with `x-api-key` returns a list of
    pre-signed S3 URLs to gzipped JSONL shards. Each record has `corpusid`, `content.text` (full plain
    text) and `content.annotations` with character-offset spans for `sectionheader`, `paragraph`, `figurecaption`,
    `tableref`, `bibentry`, etc. Filter shards locally with DuckDB/`ripgrep` on your soil-moisture term
    list. NOTE: the S2ORC dataset requires an approved API key with dataset access — apply explicitly
    for it.'
  confidence: confirmed
  priority: 2
  libraries:
  - semanticscholar
  - httpx
  - tenacity
  - duckdb
  - zstandard
  pitfalls: The unauthenticated pool is effectively unusable at scale — apply for the key on day one,
    it gates S2ORC. `openAccessPdf.url` is sometimes a landing page, not a PDF. S2ORC coverage skews to
    CS/biomed; agronomy coverage is patchier than Europe PMC + CORE combined. Annotation offsets are into
    `content.text` — off-by-one if you normalize whitespace first, so slice before cleaning.
- name: Europe PMC REST API + OA full-text XML
  what: 'Base: https://www.ebi.ac.uk/europepmc/webservices/rest . Key endpoints: /search (GET and POST),
    /{source}/{id}/fullTextXML (JATS XML for OA articles, source usually PMC), /{source}/{id}/textMinedTerms,
    /{source}/{id}/supplementaryFiles (ZIP of supplementary material), /{source}/{id}/references, /{source}/{id}/databaseLinks,
    /annotations_api.'
  why: 'Europe PMC is the best free source of STRUCTURED full text (JATS XML) — meaning `<fig>` elements
    with `<label>`, `<caption>`, and `<graphic xlink:href>`, and `<table-wrap>` with real `<table>` markup.
    For your project the `/supplementaryFiles` endpoint is gold: agronomy papers frequently park the actual
    soil moisture time series in a supplementary XLSX/CSV, and this endpoint gets it in one call with
    no scraping.'
  how: 'Search: `GET /search?query=<q>&resultType=core&format=json&pageSize=1000&cursorMark=*`. Thread
    `nextCursorMark` from the response into the next call until it stops changing. `resultType=lite|core|idlist`;
    use `core` — it includes abstract, journal, licence (`license` field, e.g. `cc by`), `isOpenAccess`,
    `inEPMC`, `hasSuppl`, `fullTextUrlList`.

    Query syntax is field-prefixed and boolean: `(TITLE:"soil moisture" OR ABSTRACT:"volumetric water
    content") AND (FULL_TEXT:"drip irrigation" OR FULL_TEXT:"center pivot") AND OPEN_ACCESS:Y AND (PUB_YEAR:[1995
    TO 2026]) AND LANG:eng`. Other prefixes: `AUTH:`, `JOURNAL:`, `DOI:`, `METHODS:`, `RESULTS:`, `FIG:`
    (searches figure captions only — extremely useful for you: `FIG:"soil water content"`), `SUPPL:`,
    `HAS_SUPPL:Y`, `HAS_DATA:Y`, `SRC:MED|PMC|PPR`.

    Use POST /searchPOST (form-encoded, same params) when your boolean string exceeds URL length — yours
    will.

    Full text: `GET /PMC/PMC1234567/fullTextXML` returns JATS. Parse with `lxml`; figures at `//fig`,
    caption text at `fig/caption//text()`, image file name at `fig/graphic/@{http://www.w3.org/1999/xlink}href`.
    Fetch the actual image via the PMC OA package (see below).

    Bulk images: the PMC Open Access Subset is on AWS S3 at `s3://pmc-oa-opendata/` (free, no requester
    pays) with `oa_comm`/`oa_noncomm` prefixes containing per-article .tar.gz bundles that include the
    ORIGINAL figure image files (usually .jpg/.png/.tif at publication resolution) plus the .nxml. Downloading
    the bundle is far better than scraping figure URLs — you get higher-resolution rasters, which directly
    improves digitization accuracy.

    Rate limit: no key needed; be polite, ~1-3 req/s, and identify yourself with a User-Agent + email.'
  confidence: confirmed
  priority: 1
  libraries:
  - lxml
  - httpx
  - boto3
  - europepmc (R) / pyeuropepmc
  pitfalls: Agronomy/soil-science journals (Agricultural Water Management, Field Crops Research, Soil
    & Tillage Research, Vadose Zone Journal) are mostly NOT in PMC unless funded by NIH/Wellcome/ERC —
    expect low coverage for your exact field, so Europe PMC is a high-quality but partial source. `FIG:`
    search only covers PMC full-text records. `fullTextXML` 404s for MED-only records.
- name: PubMed / NCBI E-utilities
  what: 'Base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/ . Tools: esearch.fcgi, efetch.fcgi, esummary.fcgi,
    elink.fcgi, epost.fcgi. Also the PMC OA service: https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi?id=PMC1234567
    returning the FTP/S3 path to the article''s tar.gz (figures included).'
  why: Mostly redundant with Europe PMC for your domain, but it is the canonical route to the PMC OA package
    (figures at original resolution) and to MeSH-controlled retrieval. Keep it as a secondary channel
    and for the OA package resolver.
  how: '`esearch.fcgi?db=pubmed&term=<query>&usehistory=y&retmax=0&api_key=KEY` returns `WebEnv` + `QueryKey`;
    then `efetch.fcgi?db=pubmed&WebEnv=...&query_key=...&retstart=0&retmax=500&retmode=xml&api_key=KEY`
    in a loop. History mode avoids re-sending giant boolean strings. Use `epost.fcgi` to push a list of
    PMIDs into history.

    Rate limits (confirmed): 3 requests/second without a key, 10 requests/second with a free `api_key`
    (generate in your NCBI account); >10 rps returns HTTP 429. Higher rates by emailing eutilities@ncbi.nlm.nih.gov.
    Also include `tool=` and `email=` params. Bulk work should run 21:00–05:00 US Eastern per NCBI guidance.

    For figures: `elink.fcgi?dbfrom=pubmed&db=pmc&id=<pmid>` → PMCID → oa.fcgi → tar.gz with .nxml + all
    figure files.

    Python: `biopython`''s `Bio.Entrez` handles history/paging; `pymed` is lighter.'
  confidence: confirmed
  priority: 4
  libraries:
  - biopython
  - httpx
  pitfalls: PubMed indexes almost no agricultural engineering journals — your recall here will be poor.
    efetch caps at 10,000 records per esearch without history. The 429 responses come back as HTML, not
    XML, and break naive parsers.
- name: CORE API v3 — aggregated OA full text (highest-recall full-text source for agronomy)
  what: 'Base: https://api.core.ac.uk/v3 . Endpoints: POST/GET /search/works, /search/outputs, /works/{id},
    /data-providers, /journals, plus a full data dump (~200M+ records, multi-TB, request via core.ac.uk/services/dataset).
    Indexes repository content from ~11,000 repositories, including university IRs and agricultural research
    institute repositories that PMC never sees.'
  why: This is the one that will actually find your irrigated-field soil moisture papers. Thesis chapters,
    extension-service reports, USDA-ARS and CGIAR repository deposits, and non-PMC journal postprints
    live here — and those are exactly the documents with multi-depth soil moisture figures. CORE also
    stores extracted `fullText` for a large fraction, so you can grep before downloading PDFs.
  how: '`GET https://api.core.ac.uk/v3/search/works?q=<elasticsearch-ish query>&limit=100&offset=0` with
    header `Authorization: Bearer <API_KEY>`. Register free at core.ac.uk/services/api.

    Query language is Elasticsearch query_string: field-scoped and boolean, e.g. `q=(title:"soil moisture"
    OR abstract:"volumetric water content") AND fullText:("drip irrigation" OR "center pivot") AND yearPublished>=1995
    AND _exists_:fullText AND language.code:en`.

    Key returned fields: `id, doi, title, abstract, fullText, downloadUrl, sourceFulltextUrls, yearPublished,
    publishedDate, documentType, dataProviders, language`. `fullText` is the plain text CORE already extracted
    — you can run your regexes on it without downloading the PDF at all.

    Paging: `offset`+`limit` works to 10,000; beyond that use `scrollId` (send `scroll=true` on the first
    call, then `scrollId=` on subsequent calls).

    Rate limit: confirmed roughly 1 batch request or 5 single requests per 10 seconds on the free tier
    — this is SLOW. For terabyte-scale work, request the CORE dataset dump instead (free for academic
    use, delivered as compressed JSONL) and query it locally in DuckDB.

    Batch endpoint: `POST /search/works` with a JSON body lets you send long boolean strings that would
    blow the URL length limit.'
  confidence: confirmed
  priority: 2
  libraries:
  - httpx
  - duckdb
  - tenacity
  pitfalls: CORE `fullText` quality is uneven (it's PDF-extracted, sometimes column-scrambled). Heavy
    duplication — the same paper appears from 5 repositories; dedupe on DOI then on normalized title.
    The free-tier rate limit is the hard bottleneck; plan on the dump. Licences are heterogeneous per
    data provider — carry `dataProviders` through so you can filter redistributable text later.
- name: Unpaywall — OA location resolution by DOI
  what: '`GET https://api.unpaywall.org/v2/{DOI}?email=you@example.com`. Returns `is_oa`, `oa_status`
    (gold|green|hybrid|bronze|closed), `best_oa_location{url, url_for_pdf, version, license, host_type,
    repository_institution}`, `oa_locations[]` (all known copies), `journal_is_oa`, `has_repository_copy`.'
  why: This is the step that converts 'I have a DOI' into 'I have a legally-downloadable PDF URL'. It
    resolves green-OA repository copies that Crossref and the publisher site will not give you, which
    roughly doubles the number of PDFs you can actually obtain.
  how: 'Single DOI: the URL above. Email param is mandatory and is the only auth. Rate limit: 100,000
    calls/day, and be gentle (~10/s). For bulk, use the free monthly Unpaywall data snapshot (JSONL.gz,
    ~150M DOIs, ~30GB compressed) from unpaywall.org/products/snapshot — load into DuckDB and join against
    your OpenAlex/Crossref DOI list offline. This is the right move for a project of your scale.

    Resolution order for getting a PDF, in priority: (1) OpenAlex `best_oa_location.pdf_url`; (2) Unpaywall
    `best_oa_location.url_for_pdf`; (3) Unpaywall `oa_locations[]` filtered to `host_type==''repository''`
    (green copies survive longer); (4) CORE `downloadUrl`; (5) Europe PMC / PMC OA tar.gz; (6) arXiv/EarthArXiv.
    Deduplicate by SHA-256 of the fetched bytes.

    Always record which location you used and its `license` string in your provenance table.'
  confidence: confirmed
  priority: 2
  libraries:
  - unpywall
  - httpx
  - duckdb
  pitfalls: '`bronze` OA means free-to-read but NO reuse licence — you can read/mine it but may not redistribute
    the text or figures; treat bronze and closed as ''extract numbers, never republish the figure''. `url_for_pdf`
    is null even when `is_oa` is true, quite often. Some repository URLs are HTML splash pages; validate
    the Content-Type is application/pdf and the first bytes are `%PDF`.'
- name: 'Preprint servers: arXiv, bioRxiv/medRxiv, EarthArXiv, OSF Preprints, agriRxiv'
  what: 'arXiv: http://export.arxiv.org/api/query (Atom XML) plus the full-text bulk sets `s3://arxiv/pdf/`
    and `s3://arxiv/src/` (requester-pays) and the Kaggle arXiv metadata dump. bioRxiv/medRxiv: https://api.biorxiv.org/details/{server}/{interval}/{cursor}/{format}
    and /pubs/{server}/... . EarthArXiv: now on CDL Janeway (eartharxiv.org) — earlier content was on
    OSF, reachable via https://api.osf.io/v2/preprints/?filter[provider]=eartharxiv. OSF: https://api.osf.io/v2/
    (preprints, nodes, files). agriRxiv: hosted by CABI.'
  why: EarthArXiv and agriRxiv are where soil physics / irrigation preprints land, and preprint PDFs are
    unambiguously fetchable and usually LaTeX-sourced — meaning their figures are VECTOR PDFs, which is
    the case where you get exact data with zero digitization error.
  how: 'arXiv: `http://export.arxiv.org/api/query?search_query=all:%22soil+moisture%22+AND+all:%22irrigation%22&start=0&max_results=100&sortBy=submittedDate`.
    Field prefixes: ti:, au:, abs:, cat:, all:. Boolean AND/OR/ANDNOT. Paging via `start`/`max_results`
    (max 2000 per call, 30000 total recommended ceiling). Rate limit: one request every 3 seconds, single
    connection — this is in the Terms of Use; violate it and you get blocked. Use `arxiv` (python) which
    enforces the delay. Relevant categories: physics.ao-ph, physics.geo-ph, stat.AP, cs.LG, eess.SP.

    For arXiv figures, download the SOURCE tarball (`https://arxiv.org/e-print/{id}`), not the PDF — it
    contains the original .eps/.pdf/.png figures AND frequently the raw .dat/.csv files the authors plotted
    from. That is a direct data source, not a digitization problem.

    bioRxiv/medRxiv: `https://api.biorxiv.org/details/biorxiv/2015-01-01/2026-09-22/0/json` — 30 records
    per page, increment cursor by 100 per the docs'' pagination (`cursor` is the offset). No search parameter
    — you must harvest the date range and filter locally. Also `https://api.biorxiv.org/covid19/...` and
    `/pubs/biorxiv/...` for preprint→published links.

    OSF: `https://api.osf.io/v2/preprints/?filter[provider]=eartharxiv&filter[date_published][gte]=2015-01-01&page[size]=100`,
    JSON:API paging via `links.next`. Files under `/v2/preprints/{id}/files/osfstorage/`. Rate limit 100
    req/hour anonymous, much higher with a Personal Access Token in `Authorization: Bearer`.'
  confidence: confirmed
  priority: 3
  libraries:
  - arxiv
  - httpx
  - feedparser
  - osfclient
  - boto3
  pitfalls: 'arXiv''s 3-second rule is enforced by IP ban, not 429. bioRxiv has no query endpoint — you
    will harvest ~300k records to filter locally; budget a day. EarthArXiv''s migration off OSF means
    the OSF route only covers pre-migration content; you need the Janeway OAI-PMH endpoint for recent
    items (verify: likely https://eartharxiv.org/api/oai or /oai).'
- name: DOAJ, BASE, OAI-PMH harvesting, and the commercial indexes (Scopus/WoS/Dimensions)
  what: 'DOAJ: https://doaj.org/api/v4/search/articles/{query} and /search/journals/{query}, plus full
    metadata dumps. BASE (Bielefeld Academic Search Engine, 400M+ docs): https://api.base-search.net/cgi-bin/BaseHttpSearchInterface.fcgi
    — requires IP whitelisting via a free application. Scopus: https://api.elsevier.com/content/search/scopus
    (X-ELS-APIKey header). Web of Science: https://api.clarivate.com/apis/wos-starter/v1/documents and
    the Expanded API. Dimensions: https://app.dimensions.ai/api/dsl.json with the DSL query language.'
  why: DOAJ and BASE extend recall into non-English and regional agronomy journals (Chinese, Indian, Iranian,
    Turkish, Brazilian irrigation literature is a large and underused pool of irrigated-field soil moisture
    figures). Scopus/WoS/Dimensions have the best subject indexing but are licence-gated — worth using
    for a curated gold-standard seed set even if you can't bulk-harvest.
  how: 'DOAJ: `GET https://doaj.org/api/v4/search/articles/bibjson.title%3A%22soil%20moisture%22?page=1&pageSize=100`.
    Elasticsearch query_string over `bibjson.*` fields. No key needed for search; be polite (~1 req/s).
    Full dump available as tar.gz.

    BASE: apply at base-search.net/about/en/faq_data.php for interface access (free for research, IP-bound).
    Returns Solr-style responses; `func=PerformSearch&query=<solr>&hits=100&offset=0`. Excellent for grey
    literature and theses.

    OAI-PMH direct harvest: for specific high-yield repositories run `?verb=ListRecords&metadataPrefix=oai_dc&set=<set>&from=<date>`
    with `sickle` or `oaipmh-scythe`. High-yield targets for you: USDA-ARS (naldc.nal.usda.gov), CGIAR
    CGSpace (cgspace.cgiar.org/oai/request), K-State/Nebraska/Texas A&M/UC Davis IRs, ICARDA, IWMI, FAO
    AGRIS (agris.fao.org — has its own API and is the single most agriculture-specific index in existence;
    search it).

    Scopus: institutional subscription required; `view=COMPLETE` needs an entitled key; text-mining requires
    an Elsevier TDM agreement and must run from a subscribing institution''s IP. WoS Starter API gives
    limited fields on a free tier (~5 req/s, 5,000 records/day). Dimensions offers free access for non-commercial
    academic research on application — its DSL is powerful: `search publications for "soil moisture irrigation"
    where year in [1995:2026] return publications[doi+title+year]`.

    LICENCE WARNING: Scopus/WoS/Dimensions terms forbid redistributing their metadata. Use them to VALIDATE
    recall of your open queries (compute what fraction of a Scopus result set your OpenAlex query recovered)
    and to seed, not as the corpus of record.'
  confidence: confirmed
  priority: 4
  libraries:
  - httpx
  - sickle
  - oaipmh-scythe
  - pybliometrics
  - dimcli
  pitfalls: BASE access is IP-bound and will silently fail from a cloud VM. AGRIS is the highest-value
