- name: Orchestration, storage and scale engineering
  what: 'How to actually run this over hundreds of thousands of PDFs without it collapsing: a content-addressed
    store, an idempotent task graph, caching, and cost control.'
  why: The failure mode of literature-mining projects is not the algorithms, it's the operations — a crawl
    that dies at 60% with no resume, a reprocess that re-downloads 2 TB, an LLM bill that surprises you.
    Getting this right is what turns the spec into a working terabyte dataset.
  how: 'STORAGE: content-addressed blob store keyed by SHA-256 (`blobs/<sha[:2]>/<sha[2:4]>/<sha>`) for
    PDFs, figure images and supplementary files; a `manifest` Parquet table mapping paper_uid→blob. Metadata
    and extracted observations in Parquet partitioned by `year` and `source_api`, queried with DuckDB.
    At the point where DuckDB strains (>1-2 TB), move to Parquet on S3 + DuckDB/Polars with predicate
    pushdown, or Postgres+TimescaleDB for the observation table.

    ORCHESTRATION: Prefect or Dagster (better lineage/asset model for this) with one asset per stage:
    discover → resolve_oa → download_pdf → parse_grobid → extract_figures → classify_figure → digitize
    → validate → normalize → load. Every stage keyed by input hash so re-runs are incremental. Alternatively
    a simple SQLite/Postgres work-queue table with states {pending, running, done, failed, needs_review}
    and a `attempts` counter — honestly sufficient and far easier to debug.

    CONCURRENCY: async httpx with a per-host semaphore and per-host token bucket (OpenAlex 10/s, Crossref
    50/s polite, Europe PMC 3/s, NCBI 10/s with key, arXiv 1 per 3s, Zenodo 0.5/s, CORE 0.5/s). `aiolimiter`
    or a small Redis-backed leaky bucket. Persist a robots/ToS note per host.

    RESPECTFUL CRAWLING: always set `User-Agent: SoilMoistureLitMiner/0.1 (+https://yourlab.example; mailto:you@example.com)`.
    Never bypass paywalls. Only download from OA locations with a licence that permits it; for closed
    papers, mine text/figures under your institution''s TDM rights and store only the DERIVED numbers,
    never the source PDF, in the public release.

    CACHING: `hishel` or `requests-cache` for all API GETs with a 30-day TTL; cache VLM calls by (model,
    prompt_hash, image_sha256) in a local KV store. On a 100k-figure corpus, the cache is the difference
    between a $500 and a $5,000 LLM bill.

    COMPUTE: figure digitization is embarrassingly parallel and CPU-bound — use `multiprocessing` / Ray
    with one worker per core; Grobid in a separate container scaled horizontally; GPU only for LineFormer
    and any VLM you self-host.

    OBSERVABILITY: per-stage counters (attempted / succeeded / flagged / rejected) written to a metrics
    table; a daily HTML report of yield by source and by journal so you can see which publishers your
    pipeline is silently failing on.

    STAGED ROLLOUT: build and validate the whole pipeline on 200 papers you know well (your own field,
    where you can check the numbers), then 5,000, then full scale. Do not write the scaling layer before
    the extraction layer works.'
