- name: Grobid — PDF to structured TEI XML with bounding-box coordinates
  what: 'Java service, run via Docker: `docker run --rm -p 8070:8070 lfoppiano/grobid:0.8.1` (full image;
    `grobid-crf` variant is lighter/CPU-only, the deep-learning image needs a GPU). REST at http://localhost:8070/api/.
    Services: /processFulltextDocument, /processHeaderDocument, /processReferences, /processCitationList,
    /processFulltextAssetDocument (returns a ZIP with TEI + extracted figure/table asset images).'
  why: Grobid is the only free tool that gives you TEI with PAGE COORDINATES for `<figure>` elements.
    Those coordinates are what let you crop the exact figure bitmap out of the PDF page and, critically,
    let you locate the corresponding VECTOR drawing objects on that page for exact extraction. It also
    gives you clean section segmentation (Methods vs Results) and a parsed bibliography for citation-graph
    snowballing.
  how: '`curl -v --form input=@paper.pdf --form consolidateHeader=1 --form consolidateCitations=0 --form
    teiCoordinates=figure --form teiCoordinates=table --form teiCoordinates=persName --form teiCoordinates=biblStruct
    --form segmentSentences=1 http://localhost:8070/api/processFulltextDocument`

    The `coords` attribute format is `page,x,y,w,h` in PDF user-space points (possibly several semicolon-separated
    boxes per element). Convert to a PyMuPDF rect and render: `page.get_pixmap(clip=fitz.Rect(x, y, x+w,
    y+h), dpi=600)`. Render at 400–600 DPI — digitization error scales inversely with pixel density and
    this single choice is worth more accuracy than most algorithm tuning.

    Use `/processFulltextAssetDocument` to get the embedded raster images as separate files in one ZIP.

    Python client: `grobid-client-python` (`grobid_client.process("processFulltextDocument", input_dir,
    output_dir, n=10, tei_coordinates=True, segment_sentences=True)`); it parallelizes across the service''s
    worker pool. Set `concurrency` to about the number of CPU cores of the container; Grobid handles ~1-5
    PDFs/s/core for the CRF models.

    Parse TEI with `lxml` under namespace `{http://www.tei-c.org/ns/1.0}`. Figure record: `//tei:figure`
    → `tei:head` (label, e.g. ''Figure 3''), `tei:figDesc` (caption text), `@coords`, and `@type=''table''`
    distinguishes tables.'
