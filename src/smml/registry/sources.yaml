sources:
- name: WSU AgWeatherNet, CoAgMet, and Intermountain/PNW irrigation networks
  short_id: agweathernet_coagmet_intermountain
  category: in_situ_network
  description: 'Western irrigation-serving ag-weather networks: Washington State University AgWeatherNet,
    Colorado''s CoAgMet, the Utah Climate Center network, and USBR AgriMet across Idaho and the Pacific
    Northwest.'
  access_method: AgWeatherNet portal/API at weather.wsu.edu (free account); CoAgMet at coagmet.colostate.edu
    with CSV/API endpoints; USBR AgriMet at usbr.gov/pn/agrimet/ with flat-file and chart-request access.
  base_url: https://weather.wsu.edu/
  auth: 'AgWeatherNet: free registered account/API key. CoAgMet and AgriMet: open.'
  confidence: recalled
  priority: 1
  depths_cm: 'AgWeatherNet: ~20 (and 8 in) at soil-moisture-equipped sites. CoAgMet: ~5, 20, 50 at Colorado
    Soil Moisture Network sites. AgriMet: ~20, 50 at selected agrimet sites'
  sensor_type: Campbell CS655 and Stevens Hydra Probe (AgWeatherNet, CoAgMet); Watermark and capacitance
    probes at AgriMet irrigation sites
  spatial_coverage: Washington (~200 AWN stations), Colorado (~90 CoAgMet), Utah, and Idaho/Oregon/Montana/Washington
    (AgriMet, ~70+)
  temporal_coverage: AWN 1988-; CoAgMet 1992-; AgriMet 1983-
  temporal_resolution: 15-min and hourly, daily summaries
  key_variables:
  - volumetric_water_content
  - soil_temperature
  - reference_et
  - crop_water_use
  - precipitation
  - air_temperature
  - relative_humidity
  - wind
  - solar_radiation
  file_formats:
  - CSV
  - JSON
  - fixed-width text
  in_ismn: 'no'
  licence: Open or free-registration research use with attribution
  n_stations_or_size: ~350+ stations across the four programs
  irrigated_relevance: This is the most irrigation-relevant cluster in the catalogue. AgWeatherNet stations
    blanket the Columbia Basin, Yakima Valley and Wenatchee orchards and vineyards — nearly all irrigated.
    USBR AgriMet exists specifically to schedule irrigation on Reclamation projects, so essentially every
    AgriMet site is in or beside an irrigated field. CoAgMet covers irrigated South Platte and Arkansas
    Valley farmland.
  gotchas: Soil moisture is an add-on at all four — most stations report only weather and ETo, so the
    soil-moisture subset is much smaller than the station count suggests. AgWeatherNet API terms restrict
    bulk redistribution.
  irrigated_stations: 'yes'
- name: AmeriFlux network soil water content (BASE product)
  short_id: ameriflux
  category: in_situ_network
  description: DOE-supported eddy-covariance network whose BASE files include SWC at one or more depths
    alongside fluxes.
  access_method: Web download form after registration (BASE-BADM zip per site); AmeriFlux also serves
    FLUXNET-format and the ONEFlux-processed products.
  base_url: https://ameriflux.lbl.gov/data/download-data/
  auth: free registration + acceptance of the AmeriFlux CC-BY-4.0 data policy
  confidence: recalled
  priority: 1
  sensor_type: 'heterogeneous by site: TDR, capacitance/FDR (CS616, CS650, Campbell), Theta/ML2 impedance
    probes'
  depths_cm: site-specific, commonly 5, 10, 20, 50, 100 (encoded in the SWC_1_1_1 / SWC_1_2_1 index scheme)
  n_stations_or_size: '>600 registered sites, several hundred with usable SWC'
  spatial_coverage: North, Central and South America; densest in CONUS
  temporal_coverage: 1990s-present, site-dependent
  temporal_resolution: half-hourly / hourly
  key_variables:
  - SWC
  - TS soil temperature
  - LE
  - H
  - NEE
  - P
  - TA
  - G
  file_formats:
  - CSV (BASE)
  - FLUXNET CSV
  licence: CC-BY-4.0 (AmeriFlux data policy; site-PI citation required)
  in_ismn: partial
  irrigated_relevance: 'The single best federal-adjacent source of irrigated-cropland soil moisture: US-Ne1
    and US-Ne2 (center-pivot irrigated maize and maize-soybean, Mead NE, with rainfed US-Ne3 as a paired
    control), US-Twt and US-Tw3 (flood-irrigated rice/alfalfa, Sacramento-San Joaquin Delta), plus irrigated
    sites in AZ, CA and the Texas High Plains.'
  gotchas: SWC depth is not in the variable name, only in the BADM metadata, so each site's depth mapping
    must be looked up individually; calibration and units (% vs m3/m3) vary by PI.
  irrigated_stations: 'yes'
- name: AZMET — Arizona Meteorological Network
  short_id: azmet
  category: in_situ_network
  description: University of Arizona network of about 30 stations in Arizona's irrigated agricultural
    districts, providing reference ET and crop water-use guidance.
  access_method: Daily and hourly flat text/CSV files and station pages under azmet.arizona.edu; predictable
    per-station, per-year file naming makes scripted bulk download easy.
  base_url: https://azmet.arizona.edu/
  auth: Open, no key
  confidence: recalled
  priority: 1
  depths_cm: Soil temperature at ~5 and ~50 (2 and 20 in); no routine volumetric soil moisture
  sensor_type: Soil thermistors; AZMET does not run a standard soil-moisture probe network
  spatial_coverage: Arizona, ~30 stations concentrated in Maricopa, Yuma, Pinal and Cochise counties
  temporal_coverage: 1987-
  temporal_resolution: Hourly and daily
  key_variables:
  - reference_evapotranspiration
  - soil_temperature
  - precipitation
  - air_temperature
  - relative_humidity
  - wind
  - solar_radiation
  - heat_units
  file_formats:
  - CSV
  - fixed-width text
  in_ismn: 'no'
  licence: Open with attribution to University of Arizona AZMET
  n_stations_or_size: ~30 stations
  irrigated_relevance: Yes, strongly — Arizona agriculture is ~100% irrigated, and AZMET stations (Maricopa,
    Yuma Valley, Yuma Mesa, Safford, Parker) sit inside flood- and pivot-irrigated districts. Station
    locations are effectively a directory of Arizona's irrigated cropland.
  gotchas: Like CIMIS, AZMET delivers soil temperature and ETo but not volumetric soil moisture, so it
    cannot serve as a soil-moisture label source. The Maricopa Agricultural Center, however, has separate
    irrigation-research soil-moisture instrumentation worth pursuing independently.
  irrigated_stations: 'yes'
- name: Berambadi / Kabini Critical Zone Observatory (AMBHAS, M-TROPICS/OZCAR)
  short_id: berambadi_kabini_czo
  category: in_situ_network
  description: Indo-French instrumented agricultural watershed in Karnataka, India, with dozens of soil
    moisture probes across rainfed and borewell-irrigated plots.
  access_method: M-TROPICS / OZCAR data portal (Kabini CZO datasets), with some series distributed by
    the IISc-IRD Indo-French Cell for Water Sciences.
  base_url: https://mtropics.obs-mip.fr
  auth: free registration / data request
  confidence: recalled
  priority: 1
  sensor_type: capacitance (Decagon 5TM/EC-5) and ThetaProbe impedance; periodic gravimetric campaigns
  depths_cm: 5, 10, 20, 50, 100 (plot-dependent)
  spatial_coverage: Berambadi watershed (~84 km2) and wider Kabini basin, Karnataka, southern India
  temporal_coverage: ~2009/2010-present
  temporal_resolution: 30 min
  key_variables:
  - soil moisture
  - groundwater level
  - rainfall
  - crop type and irrigation practice
  file_formats:
  - csv
  licence: free for research with co-authorship/citation conventions
  n_stations_or_size: tens of probe sites across the watershed (order 50 sensors)
  in_ismn: unknown
  irrigated_relevance: 'Explicitly designed around groundwater irrigation: individual plots of borewell-irrigated
    turmeric, banana, sugarcane and sunflower sit next to rainfed plots, and the site is the reference
    for Sentinel-1 irrigation-detection work in India.'
  gotchas: Sensor set and plot list change between cropping seasons, so continuous multi-year series at
    a fixed point are limited; metadata on irrigation events is sometimes qualitative.
  irrigated_stations: unknown
- name: CIMIS — California Irrigation Management Information System
  short_id: cimis
  category: in_situ_network
  description: California Department of Water Resources network of ~145 active stations sited over irrigated
    grass, built to deliver reference evapotranspiration for irrigation scheduling statewide.
  access_method: Official Web API at et.water.ca.gov/api (JSON/CSV/XML) with an application key, plus
    the CIMIS web portal.
  base_url: https://cimis.water.ca.gov/
  auth: Free registration required; API appKey issued per account
  confidence: recalled
  priority: 1
  depths_cm: Soil temperature at ~15 cm; volumetric soil moisture is NOT a standard CIMIS variable at
    most stations
  sensor_type: Soil thermistor at standard stations; soil moisture only at a small number of special/legacy
    installations
  spatial_coverage: California, ~145 active stations (250+ including retired)
  temporal_coverage: 1982-
  temporal_resolution: Hourly and daily
  key_variables:
  - reference_evapotranspiration
  - soil_temperature
  - precipitation
  - air_temperature
  - relative_humidity
  - wind
  - solar_radiation
  - vapor_pressure
  file_formats:
  - JSON
  - CSV
  - XML
  in_ismn: 'no'
  licence: Public domain (California state data) with attribution
  n_stations_or_size: ~145 active stations
  irrigated_relevance: Every CIMIS station is by design sited on well-watered irrigated grass in an agricultural
    setting — Central Valley, Imperial Valley, Salinas. That makes it the definitive US source of irrigated-condition
    ETo, and its station siting is a strong proxy map of irrigated land.
  gotchas: 'The critical limitation: CIMIS measures ETo and soil temperature, not volumetric soil moisture
    — do not budget it as a soil-moisture source. The irrigated-grass siting also means station conditions
    are not representative of surrounding crop fields for satellite validation.'
  irrigated_stations: 'yes'
- name: CMA national automatic soil moisture and agrometeorological network (China)
  short_id: cma_soil_moisture_cn
  category: in_situ_network
  description: 'China Meteorological Administration''s operational soil moisture observing system: thousands
    of automatic FDR stations plus decades of decadal gravimetric agrometeorological observations.'
  access_method: China Meteorological Data Service Centre (CMDC) catalogue with per-dataset order/download;
    most soil moisture products are restricted to domestic/registered institutional users.
  base_url: http://data.cma.cn
  auth: institutional registration; many datasets restricted to Chinese users or by formal request
  confidence: recalled
  priority: 1
  sensor_type: FDR/capacitance (automatic stations); gravimetric (agromet stations)
  depths_cm: 'automatic: 0-10, 10-20, 20-30 ... 90-100; gravimetric: 10 cm increments to 50 or 100'
  spatial_coverage: Nationwide, densest in the eastern agricultural provinces
  temporal_coverage: gravimetric ~1981-present (decadal, on the 8th/18th/28th); automatic ~2009/2013-present
  temporal_resolution: hourly (automatic); 10-daily (gravimetric)
  key_variables:
  - volumetric/gravimetric soil moisture
  - relative soil moisture
  - field capacity
  - soil temperature
  file_formats:
  - csv
  - txt
  licence: restricted; redistribution generally not permitted
  n_stations_or_size: ~2,000-2,400 automatic stations; ~700-780 agromet gravimetric stations
  in_ismn: partial
  irrigated_relevance: 'The single most important irrigated-cropland in-situ dataset in Asia: dense coverage
    of the North China Plain (Hebei, Henan, Shandong irrigated winter wheat), Xinjiang oases, and the
    Ningxia/Inner Mongolia Yellow River irrigation districts. Relative-soil-moisture jumps at these stations
    are the standard ground truth for Chinese irrigation-detection studies.'
  gotchas: Access is the bottleneck — non-Chinese requesters usually cannot get the full archive, and
    derived subsets circulate mainly through published papers. Values are often distributed as relative
    soil moisture (% of field capacity), not volumetric.
  irrigated_stations: 'yes'
- name: Heihe / HiWATER eco-hydrological observation network (Zhangye oasis)
  short_id: heihe_hiwater
  category: in_situ_network
  description: Dense, well-documented Chinese observatory in the Heihe River basin combining superstations
    and a 21-node wireless sensor network inside a flood-irrigated maize oasis.
  access_method: Dataset-level download from the National Tibetan Plateau Data Center (formerly the Heihe/WestDC
    data centre).
  base_url: https://data.tpdc.ac.cn
  auth: free registration, per-dataset agreement
  confidence: recalled
  priority: 1
  sensor_type: capacitance (Decagon EC-TM/5TM), Hydra Probe impedance, SPADE probes; co-located CRNS and
    large-aperture scintillometers
  depths_cm: 2, 4, 10, 20, 40, 80, 120, 160
  spatial_coverage: 'Heihe River basin, Gansu/Qinghai: upstream A''rou, midstream Daman/Zhangye oasis,
    downstream Sidaoqiao'
  temporal_coverage: 2008-present (HiWATER intensive 2012-2015)
  temporal_resolution: 10 min
  key_variables:
  - soil moisture
  - soil temperature
  - eddy-covariance fluxes
  - irrigation and crop management records
  file_formats:
  - csv
  - xlsx
  - netcdf
  licence: free for research, CC-BY-NC style with citation obligation
  n_stations_or_size: ~20 stations plus a 21-node in-field WSN
  in_ismn: 'no'
  irrigated_relevance: 'Best-in-class irrigated case study: Daman superstation and the surrounding WSN
    sit in border/flood-irrigated maize with documented irrigation dates and amounts, making it near-ideal
    for supervised irrigation detection.'
  gotchas: Distributed as many separate DOI'd datasets rather than a single continuous archive — assembling
    a multi-year series requires stitching several packages with inconsistent column naming (metadata
    often Chinese-only).
  irrigated_stations: unknown
- name: ICOS Ecosystem Station Network
  short_id: icos_ecosystem
  category: in_situ_network
  description: Pan-European research infrastructure whose ecosystem (flux tower) stations report standardised
    soil water content profiles alongside eddy-covariance fluxes.
  access_method: 'ICOS Carbon Portal: browsable catalogue, direct HTTP download, SPARQL metadata endpoint
    and the icoscp Python library; also bundled into FLUXNET/warm-winter releases'
  base_url: https://data.icos-cp.eu/
  auth: free account for download; CC BY 4.0
  confidence: recalled
  priority: 1
  sensor_type: mixed FDR/capacitance and TDR, station-dependent
  depths_cm: profiles typically 5, 10, 20, 30, 50, 100 (varies by station)
  spatial_coverage: Europe (approx. 15 countries)
  temporal_coverage: 2015/2016-present, some sites much longer via FLUXNET heritage
  temporal_resolution: 30 min (L2), daily/monthly aggregates
  n_stations_or_size: ~80-100 ecosystem stations
  key_variables:
  - SWC profile
  - soil temperature
  - latent/sensible heat flux
  - NEE
  - precipitation
  file_formats:
  - CSV
  - NetCDF (ETC archives)
  licence: CC BY 4.0
  in_ismn: partial
  irrigated_relevance: A small number of cropland stations are irrigated - notably Borgo Cioffi (IT-BCi,
    irrigated maize/alfalfa in Campania) and some Spanish/Italian croplands; check each site's management
    metadata.
  gotchas: SWC sensor depth, count and calibration vary per station and are only in the per-site BADM
    metadata, not the data columns; many stations report percent, not m3/m3 scaled identically.
  irrigated_stations: unknown
- name: Illinois Climate Network (WARM Program)
  short_id: illinois_climate_network_warm
  category: in_situ_network
  description: Illinois State Water Survey's Water and Atmospheric Resources Monitoring program, holding
    one of the longest continuous deep soil-moisture profile records in North America (neutron probe from
    1981, then Hydra Probe).
  access_method: ISWS WARM data pages and climate database downloads.
  base_url: https://www.isws.illinois.edu/warm/soil/
  auth: Open, no key
  confidence: recalled
  priority: 1
  depths_cm: 'Hydra Probe: 5, 10, 20, 50, 100, 150. Historic neutron probe: 10 cm increments to ~200 cm'
  sensor_type: Stevens Hydra Probe (impedance) since ~2004; downhole neutron probe 1981-2004 (biweekly)
  spatial_coverage: Illinois, 19 stations
  temporal_coverage: 1981- (soil moisture), among the longest such records anywhere
  temporal_resolution: Hourly (Hydra Probe era); biweekly (neutron-probe era)
  key_variables:
  - volumetric_water_content
  - soil_temperature
  - precipitation
  - air_temperature
  - relative_humidity
  - solar_radiation
  - wind
  - pan_evaporation
  file_formats:
  - CSV
  - text
  in_ismn: unknown
  licence: Open with attribution to Illinois State Water Survey
  n_stations_or_size: 19 stations
  irrigated_relevance: Largely rainfed; a minority of sandy-soil sites in the Havana Lowlands / Mason
    County area lie in Illinois' one significant center-pivot irrigation district. Treat the network overall
    as a rainfed long-record benchmark.
  gotchas: The 2004 neutron-probe-to-Hydra-Probe transition introduces a documented discontinuity — do
    not fit trends across it without correction. Deep (100-150 cm) sensors have higher failure rates late
    in the record.
  irrigated_stations: 'yes'
- name: International Soil Moisture Network (ISMN)
  short_id: ismn
  category: in_situ_network
  description: Global harmonised archive of in-situ soil moisture from national and research networks,
    hosted by TU Wien with ESA support.
  access_method: Free registration, then web portal download of a single zip (select networks/date range/depths);
    no public REST bulk API. The `ismn` python package (pip install ismn) reads the zip directly and builds
    a metadata index.
  base_url: https://ismn.earth
  auth: Free account (email + name + intended use); data may not be redistributed, must cite ISMN and
    the originating network.
  confidence: recalled
  priority: 1
  sensor_type: 'mixed: TDR, FDR/capacitance, impedance, neutron probe, gravimetric, some CRNS'
  depths_cm: 0-200, most stations 5, 10, 20, 50, 100
  in_ismn: 'yes'
  spatial_coverage: global, ~80 member networks
  temporal_coverage: 1952-present, dense from ~2000
  temporal_resolution: native (hourly/sub-hourly) plus derived daily
  n_stations_or_size: ~80 networks, >3000 stations (order 2900-3400 depending on release)
  file_formats:
  - Header+Values ASCII (one file per variable/depth, metadata in header)
  - CEOP format (fixed-width, all variables one file)
  - zip bundle
  key_variables:
  - soil moisture (m3/m3)
  - soil temperature
  - air temperature
  - precipitation
  - snow depth
  - SWE
  licence: Varies by contributing network; ISMN terms forbid redistribution
  irrigated_relevance: Contains irrigated-district stations (e.g. parts of SCAN/USCRN in the US High Plains
    and Central Valley, Chinese and Indian networks), but irrigation is not flagged in the metadata so
    sites must be identified by cross-referencing irrigation maps.
  gotchas: Quality flags are G (good), C (exceeds physical range C01-C03), D (dynamic/spectrum-based outlier
    tests D01-D10), M (missing/ancillary problem); filtering to G only can drop large fractions of a network.
    Depth reporting and sensor metadata are inconsistent across networks.
  irrigated_stations: unknown
- name: Kansas Mesonet
  short_id: kansas_mesonet
  category: in_situ_network
  description: Kansas State University statewide mesonet with a dedicated soil-moisture profile subnetwork
    at roughly half its stations.
  access_method: Web download tool plus a REST endpoint under mesonet.k-state.edu/rest/ (station/time/variable
    query parameters).
  base_url: https://mesonet.k-state.edu/
  auth: Open, no key
  confidence: recalled
  priority: 1
  depths_cm: 5, 10, 20, 50
  sensor_type: Campbell Scientific CS655 (some earlier CS616) coaxial impedance/TDR-type probes
  spatial_coverage: Kansas, ~80 stations; soil moisture at ~40+
  temporal_coverage: ~2008- (soil moisture expansion from ~2015)
  temporal_resolution: 5-min, hourly and daily aggregates
  key_variables:
  - volumetric_water_content
  - soil_temperature
  - bulk_electrical_conductivity
  - precipitation
  - air_temperature
  - relative_humidity
  - wind
  - solar_radiation
  file_formats:
  - CSV
  - JSON
  in_ismn: unknown
  licence: Open, attribution to Kansas Mesonet
  n_stations_or_size: ~80 stations, ~40 with soil moisture
  irrigated_relevance: Western Kansas stations (Garden City, Tribune, Colby, Scandia area) sit inside
    the irrigated Ogallala/High Plains corn belt, though the sensors themselves are usually on unirrigated
    station plots. Scandia and Garden City experiment fields have irrigated research plots nearby.
  gotchas: CS655 permittivity readings are sensitive to high soil EC in western Kansas saline soils, biasing
    VWC high. Station soil moisture start dates vary widely — check per-station metadata before building
    a time series.
  irrigated_stations: unknown
- name: Mediterranean irrigated-agriculture networks (Barrax/Las Tiesas ITAP, SIAR, IRRIFRAME/CER, Ebro-Aragon)
  short_id: mediterranean_irrigated
  category: in_situ_network
  description: 'The cluster where European irrigated-cropland soil moisture actually exists: ITAP''s Las
    Tiesas/Barrax experimental farm in Albacete, Spain''s national SIAR irrigation agroclimatic network,
    the Ebro/Aragon irrigation districts monitored by CITA, and Emilia-Romagna''s CER/IRRIFRAME irrigation
    advisory network with ARPAE stations.'
  access_method: SIAR web portal (WebSIAR) with station CSV export; ARPAE Dexter open data portal for
    Emilia-Romagna; IRRIFRAME advisory service; Barrax/Las Tiesas campaign and continuous data via ITAP
    and ESA/JRC campaign archives on request
  base_url: https://eportal.mapa.gob.es/websiar/
  auth: SIAR and Dexter open/free registration; ITAP and CITA data by request
  confidence: recalled
  priority: 1
  sensor_type: FDR/capacitance and TDR at farm sites; neutron probe and gravimetric sampling in historical
    Barrax campaigns
  depths_cm: typically 10, 20, 30, 40, 60, 100 in irrigated-scheduling profiles
  spatial_coverage: Castilla-La Mancha, Ebro basin/Aragon and Valencia (Spain); Emilia-Romagna and Po
    valley (Italy)
  temporal_coverage: Barrax campaigns since the 1990s (EFEDA, SPARC, SEN2Flex); SIAR since ~1999; IRRIFRAME
    since ~2010
  temporal_resolution: hourly to daily
  n_stations_or_size: SIAR >400 agroclimatic stations; ITAP ~30+ Albacete stations; CER/IRRIFRAME covers
    ~thousands of managed fields
  key_variables:
  - volumetric soil moisture
  - ET0 and crop ET
  - irrigation scheduling/applied water
  - soil temperature
  - meteorology
  file_formats:
  - CSV
  - XLS
  - web service exports
  licence: mixed public-sector open data; campaign data by agreement
  in_ismn: partial
  irrigated_relevance: 'This is the core irrigated set: Barrax/Las Tiesas is centre-pivot irrigated maize,
    onion, garlic and alfalfa in a dry matrix and is the classic European irrigation cal/val site; SIAR
    stations sit inside irrigation districts by design, and CER/IRRIFRAME records actual applied irrigation
    volumes in the Po valley.'
  gotchas: Most of these are agronomic irrigation-advisory services, not research soil moisture networks,
    so metadata, sensor calibration and depth documentation are weaker and few series reach ISMN; applied-irrigation
    records may be modelled recommendations rather than measured applications.
  irrigated_stations: 'yes'
- name: MOISST — Marena Oklahoma In Situ Sensor Testbed
  short_id: moisst
  category: in_situ_network
  description: Intercomparison testbed near Marena, Oklahoma where many soil-moisture sensor technologies
    are co-located in the same soil profile alongside a cosmic-ray neutron probe.
  access_method: Project website downloads; some data mirrored through Oklahoma State University and collaborating
    projects.
  base_url: https://moisst.org/
  auth: Open / registration on project site
  confidence: recalled
  priority: 1
  depths_cm: 5, 10, 20, 50, 100 (plus CRNS ~0-30 effective and neutron-probe profile to ~2 m)
  sensor_type: Co-located CS616, CS655, Stevens Hydra Probe, Delta-T Theta Probe, Decagon/METER 5TM and
    EC-5, TDR, Campbell 229-L, downhole neutron probe, and COSMOS-style CRNS
  spatial_coverage: Single intensive site, Marena OK (with satellite sites in the surrounding Oklahoma
    Mesonet footprint)
  temporal_coverage: 2010-
  temporal_resolution: Sub-hourly (typically 30-min)
  key_variables:
  - volumetric_water_content
  - matric_potential
  - soil_temperature
  - bulk_electrical_conductivity
  - neutron_count
  - precipitation
  file_formats:
  - CSV
  in_ismn: unknown
  licence: Research use; cite MOISST publications
  n_stations_or_size: 1 core testbed + a handful of satellite profiles
  irrigated_relevance: Not irrigated — rainfed native prairie/pasture. Its value is as a sensor-bias and
    cross-calibration reference for harmonising the many sensor types found across irrigated networks.
  gotchas: Small site, not a spatial network; treat it as a calibration/bias-correction dataset, not a
    training sample. Data availability per sensor is patchy across the record.
  irrigated_stations: 'no'
- name: NDAWN (North Dakota Agricultural Weather Network) and South Dakota Mesonet
  short_id: ndawn_sdmesonet
  category: in_situ_network
  description: Two Northern Plains university agricultural networks — NDSU's NDAWN across ND/MN/MT/SD
    and the SDSU Mesonet across South Dakota — both reporting soil temperature everywhere and soil moisture
    at a growing subset.
  access_method: NDAWN table/CSV generator at ndawn.ndsu.nodak.edu (get-table.html); SDSU Mesonet archive
    at climate.sdstate.edu.
  base_url: https://ndawn.ndsu.nodak.edu/
  auth: Open, no key
  confidence: recalled
  priority: 1
  depths_cm: 'NDAWN: bare and turf soil temperature at 10 cm, volumetric soil moisture at ~5, 20, 50 at
    instrumented sites. SD Mesonet: ~5, 10, 20, 50, 100 (2/4/8/20/40 in)'
  sensor_type: Stevens Hydra Probe (SD Mesonet); capacitance/CS-series probes at NDAWN soil-moisture sites
  spatial_coverage: North Dakota plus adjacent MN/MT/SD (~180-200 NDAWN stations); South Dakota (~30 SDSU
    stations)
  temporal_coverage: NDAWN 1989-; NDAWN soil moisture mostly 2019-; SD Mesonet ~2016-
  temporal_resolution: Hourly and daily (NDAWN also 5-min at newer sites)
  key_variables:
  - volumetric_water_content
  - soil_temperature
  - precipitation
  - air_temperature
  - relative_humidity
  - wind
