  spatial_coverage: United States + territories (SSURGO ~1:24,000; STATSGO2 1:250,000 gap-fill)
  spatial_resolution: Vector map units (SSURGO minimum delineation ~0.5-4 ha)
  temporal_coverage: Continuously updated; annual refresh (FY vintages)
  temporal_resolution: static (with annual re-release)
  n_stations_or_size: ~350,000 map units, ~500,000 components, ~2 M horizons nationally
  file_formats:
  - JSON
  - XML
  - HTML
  licence: US public domain
  gotchas: 'HARD LIMITS: 100,000 records and 32 MB JSON per query — chunk your point list (a few hundred
    WKT points per call is safe). Every query must have a WHERE/JOIN restriction or it is rejected. A
    single point usually returns MULTIPLE components per mukey — you must aggregate by comppct_r (dominant
    component, or component-percentage-weighted mean) and then depth-weight horizons to your target intervals
    (0-5, 5-15, ... to match SoilGrids). Suffixes: _l = low, _r = representative, _h = high; use _r. UNITS:
    sand/silt/clay = weight % of <2 mm fraction; om_r = organic matter % (multiply by 0.58 for organic
    C); ksat_r = micrometres per second (NOT cm/hr or cm/day — this trips almost everyone); awc_r = cm
    water / cm soil; wthirdbar_r and wfifteenbar_r = volumetric water content in PERCENT (and wthirdbar
    is measured on <2 mm, so correct for rock fragments); dbthirdbar_r = g/cm3; ec_r = dS/m of the saturation
    extract at 25 C; sar_r is dimensionless; caco3_r and gypsum_r are weight % of <2 mm. Many horizons
    have NULL ec_r/sar_r simply because they were never measured — NULL does not mean zero salinity. SDA_Get_Mukey_from_intersection_with_WktWgs84
    excludes STATSGO by design. Use the R package soilDB (SDA_query, SDA_spatialQuery, fetchSDA) or Python
    ''pysda''/plain requests.'
  irrigated_relevance: The single richest source of SALINITY (ec_r), SODICITY (sar_r), gypsum and carbonate
    data co-located with texture — exactly the confounders that corrupt capacitance/TDR sensor readings.
    component.irrcapcl / irrcapscl (irrigated land capability class and subclass) lets you FILTER the
