- name: FAO-56 Penman-Monteith / ASCE Standardized ET0 — computation libraries
  short_id: et0_computation
  category: weather_forcing
  description: 'Not a dataset but the essential derivation layer: given Tmax, Tmin, RH (or Tdew/actual
    vapour pressure), wind speed at 2 m, solar radiation, elevation and latitude, compute grass reference
    ET0 (FAO-56) or the ASCE standardized short (ETos) and tall (ETrs) references. Python options: RefET
    (pip install RefET, WSWUP/Open-ET, NumPy, daily and hourly, methods ''asce'' and ''refet''), openet-refet-gee
    (same equations for Google Earth Engine), pyfao56 (kthorp, full FAO-56 dual crop coefficient with
    refet.py module), pyet (multiple ET0 formulations for pandas/xarray), and the R package Evapotranspiration.
    Source: https://github.com/WSWUP/RefET , https://github.com/kthorp/pyfao56 , https://github.com/Open-ET/openet-refet-gee'
  access_method: bulk download
  base_url: https://pypi.org/project/RefET/
  auth: none
  confidence: confirmed
  priority: 1
  spatial_coverage: n/a (applies anywhere you have the inputs)
  spatial_resolution: n/a
  temporal_coverage: n/a
  temporal_resolution: hourly and daily variants (ASCE 2005 standardized equations)
  depths_cm: n/a
  key_variables:
  - 'Required inputs: tmax (degC), tmin (degC), ea (actual vapour pressure, kPa) OR tdew OR rhmax+rhmin,
    rs (incoming shortwave, MJ/m^2/day), uz (wind speed, m/s) with zw (measurement height, m), elev (m),
    lat (rad), doy'
  - 'Outputs: eto (ASCE short/grass reference, mm/day), etr (ASCE tall/alfalfa reference, mm/day)'
  - 'Intermediate quantities worth keeping as ML features: Rn (net radiation), G (soil heat flux), VPD
    (vapour pressure deficit), delta (slope of saturation vapour pressure curve), gamma (psychrometric
    constant)'
  file_formats:
  - python package
  licence: Apache 2.0 (RefET), MIT/BSD variants for others — all permissive
  n_stations_or_size: n/a
  irrigated_relevance: Fundamental. ET0 x crop coefficient Kc is the canonical irrigation-demand model,
    and ET0 (or better, ET0 accumulated since last wetting) is consistently among the strongest predictors
    in soil-moisture ML models. Because you will pull forcing from several different sources (POWER, Daymet+gridMET
    wind, ERA5-Land, AgERA5), computing ET0 YOURSELF with one consistent equation is the only way to avoid
    a forcing-source artefact leaking into your model. gridMET ships etr/pet precomputed; nothing else
    global does except Open-Meteo's et0_fao_evapotranspiration.
  gotchas: 'Wind height conversion is the classic error: ERA5/gridMET/NLDAS give 10 m wind but FAO-56
    needs 2 m — u2 = uz * 4.87 / ln(67.8*zw - 5.42), which is a factor of 0.748 for zw=10. Skipping it
    inflates ET0 by ~15-25%. ASCE ''short'' reference (ETos, 0.12 m grass) and ''tall'' reference (ETrs,
    0.50 m alfalfa) differ by ~20-30% — never mix them in one training set; gridMET''s ''pet'' is short/grass
    and ''etr'' is tall/alfalfa. Radiation must be MJ/m^2/day for daily (W/m^2 x 0.0864). The RefET ''asce''
    vs ''refet'' methods differ negligibly but pick one and record it. Soil heat flux G is assumed 0 for
    daily but is non-zero hourly.'
