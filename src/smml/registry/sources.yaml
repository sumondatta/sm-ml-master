sources:
- name: AIM-HPA — Annual Irrigation Maps, High Plains Aquifer (Deines et al. 2019)
  short_id: aim_hpa
  category: irrigation_extent
  description: 34 years of annual 30 m irrigation maps (1984-2017) over the 608,260 km2 High Plains Aquifer
    (Nebraska, Kansas, Colorado, Oklahoma, Texas panhandle, NM, WY, SD). Built in Google Earth Engine
    with Landsat greenness/phenology indices and a Bayesian land-use-change post-processing step to bridge
    Landsat 7 SLC-off gaps and suppress anomalous-greenness misclassification.
  access_method: bulk download
  base_url: https://www.hydroshare.org/resource/a371fd69d41b4232806d81e17fe4efcb/
  auth: free registration
  confidence: confirmed
  priority: 1
  spatial_coverage: US High Plains Aquifer (Ogallala)
  spatial_resolution: 30 m, EPSG:5070 CONUS Albers NAD83
  temporal_coverage: 1984-2017
  temporal_resolution: annual
  depths_cm: n/a
  key_variables:
  - irrigated (1) / not irrigated (0) annual raster
  file_formats:
  - GeoTIFF
  n_stations_or_size: 34 annual 30 m rasters over 608,260 km2
  licence: CC-BY (HydroShare resource; verify on record)
  irrigated_relevance: The Ogallala is the densest concentration of center-pivot irrigation on Earth and
    hosts a very high density of in-situ soil moisture stations (Kansas Mesonet, Nebraska Mesonet/CropWatch,
    Oklahoma Mesonet fringe, USDA-ARS Bushland TX, SCAN). Longest irrigation record available for that
    region.
  gotchas: HydroShare requires a free CUAHSI account for bulk download. Also publicly shared as a GEE
    asset by the authors — the asset id is cited in the paper's data-availability section; retrieve it
    from there rather than guessing. Ends in 2017, so pair with LANID 2018-2020 or IrrMapper for recent
    years.
  irrigated_relevance_note: null
- name: Dari et al. — high-resolution (1 and 6 km) satellite irrigation water amount estimates (ESA Irrigation+)
  short_id: dari_irrigation_amounts
  category: irrigation_extent
  description: First regional-scale remote-sensing datasets of IRRIGATION WATER AMOUNTS (mm), obtained
    by SM-based inversion of a soil water balance constrained by satellite surface soil moisture (Sentinel-1
    based at 1 km, coarser sensors at 6 km). Covers the Ebro basin (NE Spain), the Po valley (N Italy)
    and the Murray-Darling basin (SE Australia). Published in ESSD 15, 1555 (2023).
  access_method: bulk download
  base_url: https://zenodo.org/records/8086046
  auth: none
  confidence: confirmed
  priority: 1
  spatial_coverage: Ebro basin (Spain), Po valley (Italy), Murray-Darling basin (Australia)
  spatial_resolution: 1 km and 6 km
  temporal_coverage: roughly 2016-2020 per basin (verify per file)
  temporal_resolution: daily / weekly aggregated irrigation depth
  depths_cm: surface soil moisture driven (0-5 cm sensing depth), water balance to root zone
  key_variables:
  - irrigation (mm)
  - soil moisture input
  - quality flags
  file_formats:
  - NetCDF
  n_stations_or_size: 3 basins, gridded time series
  licence: CC-BY 4.0
  irrigated_relevance: 'This is the rarest and most valuable class of data for your project: an actual
    quantitative irrigation input signal, not just a yes/no label. If you want the ML model to learn the
    soil moisture response to irrigation, you need irrigation depth as a forcing feature — this and the
    NASS applied-depth statistics are the two realistic sources. The follow-up ESSD 18, 4833 (2026) ''Long-term
    irrigation water use datasets from multiple Earth Observation-based methods in major irrigated regions''
    extends this to more regions with harmonised inputs and is worth pulling too.'
  gotchas: Regional, not global. Irrigation retrieved by SM inversion is itself model-derived, so using
    it as a predictor of soil moisture risks circularity — use it as a forcing/scenario input, and never
    train and evaluate soil moisture against a target derived from the same soil moisture product. Validation
    correlation against reference irrigation was ~0.64 Pearson, F-score ~0.77 for event detection at 500
    m.
  irrigated_relevance_note: null
- name: IrrMapper (University of Montana Climate Office)
  short_id: irrmapper
  category: irrigation_extent
  description: Annual random-forest classification of irrigation status at 30 m for the 11 western US
    states (MT, ID, WY, CO, UT, NV, AZ, NM, WA, OR, CA), 1986-present. Trained on >50,000 human-verified
    irrigated fields, ~38,000 dryland fields and >500,000 km2 of uncultivated land. Distributed as a first-party
    Google Earth Engine ImageCollection, which makes it by far the easiest irrigation label to join to
    point coordinates at scale.
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/UMT_Climate_IrrMapper_RF_v1_2
  auth: GEE account
  confidence: confirmed
  priority: 1
  spatial_coverage: 11 western US states
  spatial_resolution: 30 m
  temporal_coverage: 1986-present (annual)
  temporal_resolution: annual
  depths_cm: n/a
  key_variables:
  - 'classification band: 0=irrigated, 1=dryland, 2=uncultivated, 3=wetland (verify class coding in the
    catalog page before use)'
  file_formats:
  - GEE ImageCollection
  - GeoTIFF via Export
  n_stations_or_size: 11-state 30 m annual stack, 1986-present
  licence: CC-BY 4.0
  irrigated_relevance: Best-in-class irrigation label for the western US, which is exactly where the big
    irrigated in-situ networks live (SCAN, Nevada/Arizona/Idaho AgriMet, USDA-ARS sites, Kansas/Nebraska).
    Longest annual record of any 30 m irrigation product.
  gotchas: 'GEE asset id is exactly ''UMT/Climate/IrrMapper_RF/v1_2''; v1_1 is deprecated. Class value
    ordering is NOT the intuitive 1=irrigated — read the band description. Coverage stops at the 11-state
    boundary, so for Nebraska/Kansas/Texas you need LANID or AIM-HPA instead. Code repository: github.com/dgketchum/EEMapper
    (branch IrrMapper_RF).'
  irrigated_relevance_note: null
- name: LANID — Landsat-based Irrigation Dataset (CONUS)
  short_id: lanid
  category: irrigation_extent
  description: Annual binary irrigated/non-irrigated maps at 30 m for the conterminous US, produced with
    a random-forest classifier over Landsat 5/7/8 greenness and wetness metrics plus climate and crop-mask
    covariates. Core dataset covers 1997-2017; derivative layers include maximum irrigated extent, irrigation
    frequency (number of years irrigated), trend, and 'formerly irrigated' / 'intermittently irrigated'
    classes. Annual maps for 2018-2020 were later produced with the same method. This is the single most
    useful layer for labelling a CONUS in-situ soil moisture site as irrigated in a SPECIFIC YEAR.
  access_method: bulk download
  base_url: https://doi.org/10.5281/zenodo.5548555
  auth: none
  confidence: confirmed
  priority: 1
  spatial_coverage: Conterminous United States
  spatial_resolution: 30 m (EPSG:5070 CONUS Albers, NAD83)
  temporal_coverage: 1997-2017 core; 2018-2020 extension released later
  temporal_resolution: annual
  depths_cm: n/a
  key_variables:
  - irrigated (1/0) annual raster
  - irrigation frequency (n years)
  - max irrigated extent
  - formerly irrigated
  - intermittently irrigated
  file_formats:
  - GeoTIFF
  n_stations_or_size: CONUS-wide 30 m annual stack; tens of GB uncompressed
  licence: CC-BY 4.0 (Zenodo record)
  irrigated_relevance: Directly the label you want. Sample the LANID raster at each in-situ station coordinate
    for the station-year; a station whose 30 m pixel (or 3x3 majority) is irrigated in year Y gives you
    an irrigated-field training record for that year. Also gives you 'irrigation frequency' as a soft/continuous
    feature and lets you find sites that switched status (valuable for causal contrast).
  gotchas: 'Pastureland and hay are included in the irrigated class — not only row crops. Accuracy is
    lower in humid eastern CONUS where supplemental irrigation is sporadic (commission/omission both rise).
    Pixel-level co-registration with a station''s true field matters: a 30 m pixel at a site coordinate
    may fall on a road or field edge; use a buffered majority vote. Zenodo record is a large multi-file
    archive; download per-year files, not the whole thing. A GEE mirror exists in the awesome-gee-community-catalog
    under projects/sat-io/open-datasets/ but the exact asset path must be verified before use — do not
    hardcode it blind.'
  irrigated_relevance_note: null
- name: LGRIP30 — Landsat-derived Global Rainfed and Irrigated-Cropland Product, 30 m
  short_id: lgrip30
  category: irrigation_extent
  description: GFSAD-family global 30 m map classifying every land pixel as non-cropland, water, rainfed
    cropland, or irrigated cropland (irrigated = at least one irrigation during the growing period). V001
    is nominal year 2015 (built from Landsat 8 2014-2017); V002 is nominal year 2020. Delivered as 10-degree
    x 10-degree GeoTIFF tiles. This is currently the best GLOBAL 30 m irrigated/rainfed label available.
  access_method: bulk download
  base_url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-lgrip30-l3-002
  auth: EarthData login
  confidence: confirmed
  priority: 1
  spatial_coverage: Global (90N to 90S)
  spatial_resolution: 30 m
  temporal_coverage: V001 nominal 2015 (2014-2017 inputs); V002 nominal 2020
  temporal_resolution: two static epochs
  depths_cm: n/a
  key_variables:
  - 'class: 0=non-cropland, 1=water, 2=rainfed cropland, 3=irrigated cropland (verify exact coding in
    the ATBD)'
  file_formats:
  - GeoTIFF (COG)
  n_stations_or_size: Global 30 m, ~10x10 degree tiling
  licence: NASA open data, no restrictions
  irrigated_relevance: The workhorse for labelling non-US in-situ sites (ISMN networks in Spain, Italy,
    India, China, Australia, Africa) as irrigated at 30 m. Also mirrored in the awesome-gee-community-catalog
    (gee-community-catalog.org/projects/lgrip30/) for GEE point-sampling without downloading tiles.
  gotchas: 'Only two epochs, so no year-to-year irrigation dynamics. ''Irrigated'' means irrigated at
    least once in the nominal period — supplemental/deficit irrigation gets the same label as fully irrigated.
    Requires a free NASA EarthData login and a .netrc for scripted download. LGRIP30 V1 documentation
    ATBD: lpdaac.usgs.gov/documents/1618/LGRIP30_ATBD_v1.pdf.'
  irrigated_relevance_note: null
- name: USDA NASS Quick Stats API — Irrigation and Water Management Survey and Census of Agriculture
  short_id: nass_quickstats
  category: irrigation_extent
  description: REST API over the entire NASS statistical database, including the 2023 Irrigation and Water
    Management Survey (IWMS, formerly Farm and Ranch Irrigation Survey; prior rounds 2018, 2013, 2008)
    and the Census of Agriculture county irrigation tables. 2023 IWMS reports 212,714 farms, 53.1 million
    irrigated acres, 81 million acre-feet applied, averaging 1.5 acre-feet per acre. Provides irrigated
    acres by crop, acre-inches applied per acre by crop and state, irrigation system type (gravity/sprinkler/drip),
    and water source.
  access_method: REST API
  base_url: https://quickstats.nass.usda.gov/api/api_GET/?key=YOUR_KEY&commodity_desc=...&format=JSON
  auth: API key (free, self-service at quickstats.nass.usda.gov/api)
  confidence: confirmed
  priority: 1
  spatial_coverage: 'United States: national, state, county, agricultural district'
  spatial_resolution: county (tabular)
  temporal_coverage: IWMS 2008, 2013, 2018, 2023; Census of Agriculture 1997-2022 every 5 years
  temporal_resolution: 5-yearly
  depths_cm: n/a
  key_variables:
  - AG LAND, IRRIGATED - ACRES
  - WATER APPLIED - ACRE FEET / ACRE INCHES
  - IRRIGATION, {crop} - ACRES
  - sector_desc
  - short_desc
  - domain_desc
  - state_fips_code
  - county_code
  - year
  - Value
  file_formats:
  - JSON
  - CSV
  - XML
  n_stations_or_size: Millions of records; single queries capped at 50,000 rows
  licence: US Government public domain
  irrigated_relevance: This is where you get IRRIGATION AMOUNT (acre-inches applied), not just extent
    — the closest thing to a ground-truth irrigation-depth target at county scale. Use county mean applied
    depth per crop as a prior/feature for stations in that county, and as a sanity check on any remote-sensing
    irrigation-amount estimate.
  gotchas: Hard 50,000-record cap per request — paginate by year or state or the call errors out. Many
    county cells are suppressed (D) for disclosure; the API returns them as '(D)' strings, so parse Values
    as strings first. The endpoint /api/get_param_values is how you discover valid short_desc strings;
    guessing them wastes a lot of time. Also /api/get_counts to size a query before running it.
  irrigated_relevance_note: null
- name: USDA NASS Cropland Data Layer (CDL)
  short_id: usda_cdl
  category: irrigation_extent
  description: Annual 30 m crop-specific land cover for CONUS from 2008 (some states earlier, back to
    1997) to present, from Landsat/Sentinel-2/DEIMOS plus USDA FSA Common Land Unit ground truth. Includes
    >100 crop classes plus fallow/idle, double-crop combinations, and in some states explicit irrigated
    variants of a few classes.
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/USDA_NASS_CDL
  auth: GEE account (or none for CropScape bulk download)
  confidence: confirmed
  priority: 1
  spatial_coverage: Conterminous United States
  spatial_resolution: 30 m
  temporal_coverage: 2008-present nationally; 1997-2007 for selected states
  temporal_resolution: annual
  depths_cm: n/a
  key_variables:
  - cropland (crop class code)
  - cultivated
  - confidence
  - cropland_class_names / cropland_class_palette metadata
  file_formats:
  - GEE ImageCollection
  - GeoTIFF via CropScape (nassgeodata.gmu.edu/CropScape)
  n_stations_or_size: Annual CONUS 30 m, ~2008-present
  licence: Public domain, no copyright restrictions, free to redistribute
  irrigated_relevance: 'Not an irrigation label by itself, but the crop-type feature you need: soil moisture
    dynamics under irrigated corn, alfalfa, cotton and rice are completely different. Rice classes are
    a de facto flood-irrigation label. Combine CDL crop type x LANID/IrrMapper irrigation status as the
    joint stratification variable for your ML training set. GEE asset id exactly ''USDA/NASS/CDL''.'
  gotchas: Class accuracy is high for major commodity crops and poor for minor specialty crops and for
    grass/pasture classes. Class codes change slightly between years — always read cropland_class_names
    from the image properties rather than hardcoding. The 'confidence' band exists only for recent years.
  irrigated_relevance_note: null
- name: ESA WorldCereal 10 m — global seasonal irrigation and crop-type maps
  short_id: worldcereal
  category: irrigation_extent
  description: First global 10 m seasonal ACTIVE IRRIGATION maps, alongside temporary-crops, crop-type
    (maize, cereals) and active-cropland markers, for the 2021 reference year, produced per agro-ecological
    zone (106 AEZs) with each zone processed on its own seasonality. Described in ESSD 15, 5491 (2023).
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/ESA_WorldCereal_2021_MODELS_v100
  auth: GEE account
  confidence: confirmed
  priority: 1
  spatial_coverage: Global (by agro-ecological zone)
  spatial_resolution: 10 m
  temporal_coverage: '2021 (seasonal: tc-annual, tc-wintercereals, tc-maize-main, tc-maize-second, tc-springcereals)'
  temporal_resolution: per agricultural season within 2021
  depths_cm: n/a
  key_variables:
  - irrigation (active irrigation binary + confidence)
  - temporarycrops
  - maize
  - wintercereals
  - springcereals
  - activecropland
  file_formats:
  - GEE ImageCollection
  - GeoTIFF via Zenodo (zenodo.org/records/7875105)
  n_stations_or_size: Global 10 m; Zenodo archive is organised as WorldCereal_{year}_{season}_{product}_{classification|confidence}.zip
    covering up to 106 AEZs per file
  licence: CC-BY 4.0
  irrigated_relevance: 'Highest-resolution global irrigation label in existence (10 m), and it is SEASONAL,
    so it distinguishes a winter-cereal irrigation from a maize irrigation in the same pixel. Best single
    global labelling layer for non-US sites. GEE asset ids: ''ESA/WorldCereal/2021/MODELS/v100'' (classification
    models incl. irrigation) and ''ESA/WorldCereal/2021/MARKERS/v100'' (active cropland).'
  gotchas: Only the 2021 reference year in v100 — no multi-year dynamics yet. The irrigation product's
    accuracy is markedly weaker than the cropland product and varies strongly by AEZ; always carry the
    accompanying confidence band as a sample weight rather than treating the label as ground truth. Filter
    the ImageCollection by the 'product' property to get the irrigation band.
  irrigated_relevance_note: null
- name: Copernicus DEM GLO-30 and SRTM (terrain and derived topographic features)
  short_id: dem_terrain
  category: remote_sensing
  description: Copernicus DEM GLO-30 is a 30 m global digital surface model derived from TanDEM-X WorldDEM
    with water-body flattening and river-flow consistency, and is now the preferred global DEM over SRTM.
    SRTM GL1 (30 m, 60N-56S, 2000) remains the legacy standard and is what most published soil moisture
    papers used.
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_DEM_GLO30
  auth: 'GEE account (also free on AWS Open Data: registry.opendata.aws/copernicus-dem/ and OpenTopography)'
  confidence: confirmed
  priority: 1
  spatial_coverage: Global (Copernicus DEM); 60N-56S (SRTM)
  spatial_resolution: 30 m
  temporal_coverage: static (2011-2015 acquisition for CopDEM; Feb 2000 for SRTM)
  temporal_resolution: static
  depths_cm: n/a
  key_variables:
  - DEM elevation (m)
  - 'derived: slope (deg), aspect (sin/cos encoded), profile and plan curvature, Topographic Wetness Index
    TWI = ln(a/tan(beta)), flow accumulation, height above nearest drainage HAND, topographic position
    index TPI'
  file_formats:
  - GEE Image/ImageCollection
  - GeoTIFF
  n_stations_or_size: Global 30 m
  licence: 'Copernicus DEM: free with attribution (ESA licence, redistribution conditions apply); SRTM:
    public domain'
  irrigated_relevance: 'Terrain is the cheapest high-value static feature set for soil moisture. TWI captures
    lateral redistribution and is often the top-ranked static predictor after soil texture. For irrigated
    fields specifically, slope is a strong proxy for irrigation METHOD: flood/furrow irrigation requires
    near-flat land (<1-2%), so a steep irrigated field is almost certainly sprinkler or drip. GEE asset
    ids: ''COPERNICUS/DEM/GLO30'' (ImageCollection, band DEM — needs .mosaic()) and ''USGS/SRTMGL1_003''
    (Image, band elevation). Note there is also a dated variant ''COPERNICUS/DEM/GLO30_2024_1''.'
  gotchas: Copernicus DEM is a SURFACE model (includes canopy and buildings), so raw slope over tall crops
    or shelterbelts is noisy — smooth before deriving slope, or use a DTM. GLO30 in GEE is an ImageCollection
    of tiles, not a single image; forgetting .mosaic() is a common bug. SRTM has voids in steep terrain
    and is 25 years old, so it misses recent land levelling in irrigation districts.
  irrigated_relevance_note: null
- name: ESA CCI Soil Moisture v09.x (ACTIVE, PASSIVE, COMBINED)
  short_id: esa_cci_sm
  category: remote_sensing
  description: The long-term merged multi-satellite soil moisture climate data record. COMBINED and PASSIVE
    cover 1978-11-01 onward; ACTIVE covers 1991-08-05 onward. v09.1 extends to 2023-12-31 and v09.2 to
    2024-12-31. Global daily images at 0.25 degrees. PASSIVE and COMBINED are volumetric (m3/m3); ACTIVE
    is percent of saturation.
  access_method: FTP
  base_url: https://catalogue.ceda.ac.uk/uuid/779f116d0477439db1874592add5848c/
  auth: none
  confidence: confirmed
  priority: 1
  spatial_coverage: Global
  spatial_resolution: 0.25 degrees (~25 km)
  temporal_coverage: 1978-11-01 to 2024-12-31 (v09.2); ACTIVE from 1991-08-05
  temporal_resolution: daily
  depths_cm: 0-5 (surface)
  key_variables:
  - sm
  - sm_uncertainty
  - flag
  - freqbandID
  - sensor
  - mode
  - t0
  file_formats:
  - NetCDF-4 classic, daily global images
  n_stations_or_size: ~46 years of daily global 0.25 deg grids; a few hundred GB
  licence: ESA CCI open data, free, no registration required
  irrigated_relevance: Longest soil moisture record in existence, so it is the only way to give historical
    in-situ records (1990s-2000s) a satellite covariate. Free and no-registration download from the CEDA
    archive under data/daily_files makes it the easiest bulk grab of any SM product.
  gotchas: 'Unit mismatch between products (ACTIVE in %, COMBINED/PASSIVE in m3/m3) is the classic harmonisation
    bug. The sensor mix changes through time, so the record has documented inhomogeneities — always carry
    the ''sensor'' and ''freqbandID'' bands as features/flags so the model can learn the sensor-era offset
    rather than being confused by it. CCI is CDF-matched to a GLDAS-Noah climatology, which has no irrigation,
    so CCI absolute values over irrigated regions are biased low. FAQ: climate.esa.int/en/projects/soil-moisture/data/frequently-asked-questions/'
  irrigated_relevance_note: null
- name: Landsat Collection 2 Level-2 surface reflectance and surface temperature
  short_id: landsat_c2_l2
  category: remote_sensing
  description: Atmospherically corrected 30 m surface reflectance plus 30 m (thermally resampled from
    100 m) surface temperature for Landsat 4/5/7/8/9. The only optical archive long enough to cover the
    full span of most in-situ soil moisture records, back to 1984.
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/LANDSAT_LC08_C02_T1_L2
  auth: GEE account (or free EarthData/USGS login for USGS M2M / earthexplorer bulk)
  confidence: recalled
  priority: 1
  spatial_coverage: Global
  spatial_resolution: 30 m reflectance; ST_B10 thermal at 30 m posting (100 m native)
  temporal_coverage: 1984-present (L5 1984-2012, L7 1999-2022 usable, L8 2013-present, L9 2021-present)
  temporal_resolution: 16-day per satellite; ~8-day with two in orbit
  depths_cm: n/a
  key_variables:
  - SR_B1..SR_B7
  - ST_B10 (surface temperature, K, scale 0.00341802 offset 149.0)
  - QA_PIXEL
  - QA_RADSAT
  - ST_QA
  file_formats:
  - GEE ImageCollection
  - GeoTIFF
  n_stations_or_size: 40+ years global 30 m
  licence: US Government public domain
  irrigated_relevance: '30 m thermal is the key one: irrigated fields are measurably COOLER than surrounding
    rainfed land because of evaporative cooling. The land surface temperature depression relative to neighbours
    is a strong irrigation indicator and a strong soil moisture predictor in its own right (the basis
    of the thermal-inertia and triangle/trapezoid methods). Compute a normalised LST anomaly, not raw
    LST.'
  gotchas: 'GEE asset ids: ''LANDSAT/LC08/C02/T1_L2'', ''LANDSAT/LC09/C02/T1_L2'', ''LANDSAT/LE07/C02/T1_L2'',
    ''LANDSAT/LT05/C02/T1_L2''. Scaling factors are mandatory: SR = DN*0.0000275 - 0.2; ST = DN*0.00341802
    + 149.0. Landsat 7 SLC-off stripes from 2003 onward. 16-day revisit plus clouds means an irrigation
    event is usually missed entirely — Landsat gives you seasonal state, Sentinel-1 gives you events.'
  irrigated_relevance_note: null
- name: MODIS land surface temperature (MOD11A1/MYD11A1, MOD11A2) and vegetation indices (MOD13Q1/MYD13Q1,
    MOD13A1)
  short_id: modis_lst_ndvi
  category: remote_sensing
  description: Daily 1 km LST/emissivity from Terra (MOD11A1, ~10:30/22:30 local) and Aqua (MYD11A1, ~13:30/01:30
    local), 8-day composite at 1 km (MOD11A2); and 16-day 250 m NDVI/EVI (MOD13Q1/MYD13Q1) or 500 m (MOD13A1).
    Collection 6.1 is current.
  access_method: Google Earth Engine
  base_url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MOD11A1
  auth: GEE account (or EarthData login at LP DAAC)
  confidence: recalled
  priority: 1
  spatial_coverage: Global
  spatial_resolution: 1 km (LST), 250 m (NDVI/EVI MOD13Q1), 500 m (MOD13A1)
  temporal_coverage: Terra 2000-02 to present; Aqua 2002-07 to present
  temporal_resolution: daily (LST), 8-day (MOD11A2), 16-day (MOD13)
  depths_cm: n/a (skin temperature)
  key_variables:
  - LST_Day_1km, LST_Night_1km (K, scale 0.02)
  - QC_Day, QC_Night
  - Day_view_time
  - Emis_31, Emis_32
  - NDVI, EVI (scale 0.0001)
  - SummaryQA
  - DetailedQA
  - sur_refl_b01..b07
  file_formats:
  - HDF-EOS
  - GEE ImageCollection
  n_stations_or_size: Global, 25 years, daily
  licence: NASA open, no restrictions
  irrigated_relevance: 'Day-minus-night LST (diurnal temperature range) is a classic thermal-inertia soil
    moisture proxy and is strongly suppressed by irrigation. Aqua 13:30 LST is near the daily max and
    is the most moisture-sensitive overpass. Combined with NDVI it gives you the LST/NDVI ''triangle''
    feature space, which is the basis of most thermal soil moisture downscaling — including the BEC SMOS
    L4 1 km product. GEE asset ids: ''MODIS/061/MOD11A1'', ''MODIS/061/MYD11A1'', ''MODIS/061/MOD11A2'',
    ''MODIS/061/MOD13Q1'', ''MODIS/061/MYD13Q1''.'
