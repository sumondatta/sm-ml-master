- name: USDA-NRCS Soil Data Access (SDA) — SSURGO / STATSGO2 / gNATSGO tabular web service
  short_id: usda_sda
  category: soil_property
  description: "The authoritative query interface to the US soil survey tabular database. REST/POST endpoint:\
    \ https://SDMDataAccess.sc.egov.usda.gov/Tabular/post.rest (legacy SOAP at https://SDMDataAccess.sc.egov.usda.gov/Tabular/SDMTabularService.asmx).\
    \ POST a JSON body: {\"SERVICE\":\"query\",\"FORMAT\":\"JSON+COLUMNNAME\",\"QUERY\":\"<T-SQL>\"} ;\
    \ FORMAT may be JSON, JSON+COLUMNNAME, JSON+COLUMNNAME+METADATA, XML, or HTML. EXACT SQL TO GET EVERY\
    \ WATER/SENSOR-RELEVANT HORIZON PROPERTY AT A POINT:\n\nSELECT m.mukey, m.muname, c.cokey, c.compname,\
    \ c.comppct_r, c.majcompflag, c.taxclname, c.taxpartsize, c.drainagecl, c.hydgrp, c.irrcapcl, c.irrcapscl,\
    \ c.slope_r,\n  ch.chkey, ch.hzname, ch.hzdept_r, ch.hzdepb_r,\n  ch.sandtotal_r, ch.silttotal_r,\
    \ ch.claytotal_r,\n  ch.sandvf_r, ch.sandfine_r, ch.sandmed_r, ch.sandco_r, ch.sandvc_r,\n  ch.om_r,\
    \ ch.dbthirdbar_r, ch.dbovendry_r, ch.ksat_r, ch.awc_r,\n  ch.wtenthbar_r, ch.wthirdbar_r, ch.wfifteenbar_r,\
    \ ch.wsatiated_r,\n  ch.ec_r, ch.sar_r, ch.caco3_r, ch.gypsum_r, ch.cec7_r, ch.ecec_r,\n  ch.ph1to1h2o_r,\
    \ ch.ph01mcacl2_r, ch.lep_r, ch.kwfact,\n  (SELECT SUM(cf.fragvol_r) FROM chfrags AS cf WHERE cf.chkey\
    \ = ch.chkey) AS fragvol_total_r\nFROM legend AS l\n  INNER JOIN mapunit  AS m  ON m.lkey  = l.lkey\n\
    \  INNER JOIN component AS c ON c.mukey = m.mukey\n  LEFT  JOIN chorizon  AS ch ON ch.cokey = c.cokey\n\
    WHERE m.mukey IN (\n  SELECT mukey FROM SDA_Get_Mukey_from_intersection_with_WktWgs84('POINT(-97.05\
    \ 41.17)')\n)\nORDER BY c.comppct_r DESC, ch.hzdept_r ASC;\n\nBatch many points by unioning WKT MULTIPOINT,\
    \ or by first resolving mukeys then running 'WHERE m.mukey IN (...)'. Other useful helper functions:\
    \ SDA_Get_Mukey_from_intersection_with_WktWgs84('POLYGON((...))'), SDA_Get_MupolygonWktWgs84_from_Mukey('461994'),\
    \ SDA_Get_ComponentName_from_Mukey. To restrict to SSURGO only add \"AND l.areasymbol <> 'US'\"; to\
    \ get STATSGO2 use \"AND l.areasymbol = 'US'\"."
